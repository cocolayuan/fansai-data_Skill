<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新增内容资产 · Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b2430; --ink2:#0f3132; --muted:#64748b; --muted2:#94a3b8; --line:#e8efef;
    --teal:#008aa8; --blue:#49B6D8; --green:#3FB36A; --lime:#A7E885;
    --xhs:#FF2741; --wx:#07C160;
    --cn:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    --en:"Outfit","Noto Sans SC",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--cn);font-weight:500;color:var(--ink);-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;
    background:
      radial-gradient(1100px 680px at 88% -12%, rgba(73,182,216,.20), transparent 60%),
      radial-gradient(900px 620px at -8% 14%, rgba(139,217,140,.18), transparent 60%),
      radial-gradient(820px 560px at 50% 118%, rgba(0,138,168,.12), transparent 60%),
      #E7F0EE;}
  .scrim{position:fixed;inset:0;background:rgba(231,240,238,.4);backdrop-filter:blur(2px)}

  /* ---------- modal ---------- */
  .modal{position:relative;width:900px;max-width:100%;max-height:calc(100vh - 56px);display:flex;flex-direction:column;
    background:linear-gradient(168deg,rgba(255,255,255,.9),rgba(255,255,255,.8));
    backdrop-filter:blur(34px) saturate(1.25);border:1px solid rgba(255,255,255,.78);border-radius:28px;
    box-shadow:0 44px 120px -34px rgba(15,49,50,.42), inset 0 1px 0 rgba(255,255,255,.65);overflow:hidden}
  .mhead{display:flex;align-items:flex-start;justify-content:space-between;padding:30px 36px 20px;flex:0 0 auto}
  .mhead .t{font-size:19px;font-weight:500;color:var(--ink);letter-spacing:.3px}
  .mhead .s{font-size:13px;color:var(--muted2);margin-top:7px}
  .xbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.6);
    display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;transition:.18s;flex:0 0 auto}
  .xbtn:hover{background:#fff;color:var(--ink)}
  .xbtn svg{width:18px;height:18px}

  .mbody{flex:1;overflow-y:auto;padding:6px 36px 28px}
  .mbody::-webkit-scrollbar{width:8px}
  .mbody::-webkit-scrollbar-thumb{background:rgba(15,49,50,.14);border-radius:8px}

  /* form */
  .field{margin-bottom:20px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  label.lb{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:9px}
  label.lb .req{color:var(--xhs);font-size:13px}
  .inp,.sel,.ta{width:100%;font-family:var(--cn);font-weight:500;font-size:14px;color:var(--ink);
    background:rgba(255,255,255,.62);border:1px solid var(--line);border-radius:14px;padding:13px 16px;outline:none;transition:.18s}
  .inp::placeholder,.ta::placeholder{color:var(--muted2)}
  .inp:focus,.ta:focus,.sel:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(73,182,216,.16);background:#fff}
  .ta{resize:vertical;min-height:78px;line-height:1.55}
  .selwrap{position:relative}
  .sel{appearance:none;cursor:pointer;padding-right:42px}
  .selwrap .cv{position:absolute;right:15px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted2);pointer-events:none}
  .num-en{font-family:var(--en);font-weight:600}
  /* 表现分 with band hint */
  .scorerow{position:relative}
  .scoredot{position:absolute;right:46px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:7px;
    font-size:12px;color:var(--muted2);pointer-events:none}
  .scoredot i{width:8px;height:8px;border-radius:50%;background:var(--blue)}

  /* sub-label divider */
  .sublabel{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:500;color:var(--muted);margin:26px 0 16px}
  .sublabel .ln{flex:1;height:1px;background:linear-gradient(90deg,rgba(231,239,239,.95),transparent)}
  .sublabel .hint{font-size:11.5px;color:var(--muted2);font-weight:500}

  /* 渠道分发 grid */
  .chan-head,.chan-row{display:grid;grid-template-columns:150px 116px repeat(5,1fr);gap:10px;align-items:center}
  .chan-head{padding:0 4px 10px}
  .chan-head .ch{font-size:11.5px;color:var(--muted2);font-weight:500;text-align:center}
  .chan-head .ch:first-child,.chan-head .ch:nth-child(2){text-align:left}
  .chan-row{padding:11px 4px}
  .chan-row + .chan-row{border-top:1px solid rgba(15,49,50,.06)}
  .chan-name{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink);font-weight:500}
  .chlogo{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .chlogo svg{display:block}
  .chlogo .txt{color:#fff;font-size:11px;font-weight:700;font-family:var(--cn)}
  .st-sel{position:relative}
  .st-sel .sel{padding:10px 32px 10px 30px;font-size:13px;border-radius:11px}
  .st-sel .dot{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:7px;height:7px;border-radius:50%;background:#94A3B8;pointer-events:none}
  .st-sel .cv{right:11px;width:13px;height:13px}
  .minp{width:100%;font-family:var(--en);font-weight:600;font-size:14px;color:var(--ink);text-align:center;
    background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:11px;padding:10px 6px;outline:none;transition:.18s}
  .minp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(73,182,216,.16);background:#fff}
  .minp.zero{color:var(--muted2)}

  /* footer */
  .mfoot{flex:0 0 auto;display:flex;align-items:center;justify-content:flex-end;gap:12px;
    padding:18px 36px;border-top:1px solid rgba(15,49,50,.08);background:rgba(255,255,255,.4)}
  .btn{font-family:var(--cn);font-weight:500;font-size:14px;border-radius:14px;padding:12px 22px;cursor:pointer;transition:.18s;border:none}
  .btn-ghost{background:rgba(255,255,255,.6);border:1px solid var(--line);color:var(--ink)}
  .btn-ghost:hover{background:#fff}
  .btn-primary{background:var(--ink);color:#fff;box-shadow:0 14px 28px -12px rgba(27,36,48,.5)}
  .btn-primary:hover{transform:translateY(-1px)}

  /* ---------- 效果 effects ---------- */
  @keyframes scrimIn{from{opacity:0}to{opacity:1}}
  @keyframes modalIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
  .scrim{animation:scrimIn .35s ease both}
  .modal{animation:modalIn .52s cubic-bezier(.2,.7,.2,1) both}
  /* 焦点时 label 变 teal */
  .field:focus-within>.lb,.grid2>div:focus-within>.lb{color:var(--teal)}
  /* 必填校验 */
  .inp.err{border-color:#D6455B;box-shadow:0 0 0 4px rgba(214,69,91,.14);background:#fff}
  .err-msg{font-size:12px;color:#D6455B;margin-top:7px;display:none}
  .err-msg.show{display:block}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .shake{animation:shake .3s}
  /* 表现分分段色点 */
  .scoredot .bt{transition:color .2s}
  /* 标签 chips */
  .tags{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:50px;
    background:rgba(255,255,255,.62);border:1px solid var(--line);border-radius:14px;padding:9px 12px;transition:.18s}
  .tags:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px rgba(73,182,216,.16);background:#fff}
  .chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--teal);
    background:rgba(0,138,168,.1);border-radius:10px;padding:6px 7px 6px 11px;animation:chipIn .2s ease}
  @keyframes chipIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
  .chip b{font-weight:500}
  .chip .rm{cursor:pointer;display:flex}.chip .rm svg{width:13px;height:13px;color:var(--teal);opacity:.65}
  .chip .rm:hover svg{opacity:1}
  .tags input{flex:1;min-width:140px;border:none;outline:none;background:transparent;
    font-family:var(--cn);font-weight:500;font-size:14px;color:var(--ink);padding:5px 2px}
  .tags input::placeholder{color:var(--muted2)}
  /* 渠道行 hover + 指标锁定 */
  .chan-row{border-radius:12px;transition:.15s}
  .chan-row:hover{background:rgba(255,255,255,.45)}
  .minp:disabled{background:rgba(15,49,50,.035);color:#c2cdd0;cursor:not-allowed;border-color:rgba(232,239,239,.7)}

  /* ---------- 自定义下拉（瓦片式，对齐 ai_generate_modal.html）---------- */
  .dd{position:relative}
  .dd-trig{display:flex;align-items:center;gap:9px;width:100%;font-family:var(--cn);font-weight:500;font-size:14px;color:var(--ink);
    background:rgba(255,255,255,.62);border:1px solid var(--line);border-radius:14px;padding:13px 16px;cursor:pointer;transition:.18s;text-align:left}
  .dd-trig:hover{border-color:#cfe0e0;box-shadow:0 4px 12px -8px rgba(15,49,50,.2)}
  .dd.open .dd-trig{border-color:var(--blue);box-shadow:0 0 0 4px rgba(73,182,216,.16);background:#fff}
  .dd-trig .dd-val{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dd-trig .dd-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:#94A3B8}
  .dd-trig .cv{width:7px;height:7px;border-right:1.8px solid var(--muted2);border-bottom:1.8px solid var(--muted2);
    transform:rotate(45deg);margin-top:-3px;flex:0 0 auto;transition:transform .2s}
  .dd.open .dd-trig .cv{transform:rotate(225deg);margin-top:2px}
  .dd-pop{position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:30;background:#fff;border:1px solid var(--line);border-radius:14px;
    box-shadow:0 20px 48px -18px rgba(15,49,50,.34);padding:10px;display:none;animation:ddIn .16s ease}
  .dd.up .dd-pop{top:auto;bottom:calc(100% + 8px)}
  .dd.open .dd-pop{display:block}
  @keyframes ddIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .dd-grid{display:flex;flex-wrap:wrap;gap:7px}
  .dd-opt{padding:9px 14px;border-radius:10px;border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;transition:.15s;background:#fff;white-space:nowrap}
  .dd-opt:hover{border-color:#cfe0e0}
  .dd-opt.on{border-color:var(--blue);background:rgba(73,182,216,.1);color:var(--ink)}
  /* 渠道状态：紧凑 + 带色点 */
  .dd.sm .dd-trig{padding:10px 12px;font-size:13px;border-radius:11px}
  .dd.sm .dd-pop{min-width:108px}
</style>
</head>
<body>
  <div class="scrim"></div>
  <div class="modal">
    <!-- header -->
    <div class="mhead">
      <div>
        <div class="t">新增内容资产</div>
        <div class="s">维护内容策略、素材信息和渠道分发数据。</div>
      </div>
      <div class="xbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></div>
    </div>

    <!-- body -->
    <div class="mbody">
      <div class="field">
        <label class="lb">标题 <span class="req">*</span></label>
        <input class="inp" id="titleInp" placeholder="例：OCTAVE 品牌宣传片：意识生活方式" autofocus>
        <div class="err-msg" id="titleErr">标题为必填项</div>
      </div>

      <div class="grid2 field">
        <div>
          <label class="lb">分类</label>
          <div class="dd" id="dd-cat"></div>
        </div>
        <div>
          <label class="lb">形式</label>
          <input class="inp" value="短视频" placeholder="如 短视频 / 海报 / 长图文">
        </div>
      </div>

      <div class="grid2 field">
        <div>
          <label class="lb">负责人</label>
          <input class="inp" value="Growth Team" placeholder="负责人 / 团队">
        </div>
        <div>
          <label class="lb">表现分 <span style="color:var(--muted2);font-weight:400">0–100</span></label>
          <div class="scorerow selwrap">
            <input class="inp num-en" id="scoreInp" value="70" inputmode="numeric">
            <span class="scoredot"><i></i><span class="bt">70–84 · 良好</span></span>
          </div>
        </div>
      </div>

      <div class="grid2 field">
        <div>
          <label class="lb">闭环阶段</label>
          <div class="dd" id="dd-stage"></div>
        </div>
        <div>
          <label class="lb">状态</label>
          <div class="dd" id="dd-status"></div>
        </div>
      </div>

      <div class="field">
        <label class="lb">内容目标</label>
        <textarea class="ta" placeholder="一句话描述这条资产的运营目标与定位，会作为列表副标题并参与搜索。"></textarea>
      </div>

      <div class="field">
        <label class="lb">标签</label>
        <div class="tags" id="tags"><input id="tagin" placeholder="输入后回车添加，如 品牌、海外、线索"></div>
      </div>

      <div class="field">
        <label class="lb">优化建议</label>
        <textarea class="ta" placeholder="下一步运营 / 迭代建议，可留空。"></textarea>
      </div>

      <!-- 渠道分发 -->
      <div class="sublabel">渠道分发<span class="hint">状态为「分发中 / 已发布 / 优化中」时方可填写指标</span><span class="ln"></span></div>
      <div class="chan-head">
        <div class="ch">渠道</div><div class="ch">状态</div>
        <div class="ch">曝光 (万)</div><div class="ch">点击</div><div class="ch">互动 (万)</div><div class="ch">线索</div><div class="ch">转化</div>
      </div>
      <div id="chans"></div>
    </div>

    <!-- footer -->
    <div class="mfoot">
      <div class="btn btn-ghost">取消</div>
      <div class="btn btn-primary">保存内容</div>
    </div>
  </div>

<script>
const STATUS={"待排期":"#94A3B8","制作中":"#FF9F6E","分发中":"#49B6D8","已发布":"#3FB36A","优化中":"#008aa8"};
function chLogo(b){
  if(b==="wx") return `<div class="chlogo" style="background:#07C160"><svg viewBox="0 0 28 24" width="20" height="20" fill="none"><path d="M10.5 2C5.3 2 1 5.5 1 9.8c0 2.4 1.4 4.6 3.6 6L3.8 18.6l3-1.6c.9.2 1.8.4 2.7.4h.3c-.2-.6-.3-1.3-.3-1.9 0-3.7 3.6-6.7 8.2-6.7.3 0 .6 0 .8.05C18.1 4.9 14.6 2 10.5 2Z" fill="#fff"/><circle cx="7" cy="7.6" r="1.1" fill="#07C160"/><circle cx="13.6" cy="7.6" r="1.1" fill="#07C160"/><path d="M27 15.3c0-3.1-3.1-5.6-7-5.6s-7 2.5-7 5.6 3.1 5.6 7 5.6c.9 0 1.7-.1 2.5-.4l2.4 1.3-.7-2.2c1.7-1 2.8-2.5 2.8-4.3Z" fill="#fff"/><circle cx="17.5" cy="14.5" r=".9" fill="#07C160"/><circle cx="22.5" cy="14.5" r=".9" fill="#07C160"/></svg></div>`;
  if(b==="xhs") return `<div class="chlogo" style="background:#FF2741"><span class="txt" style="font-size:9px;letter-spacing:-.5px">小红书</span></div>`;
  return `<div class="chlogo" style="background:linear-gradient(45deg,#FEDA75,#FA7E1E 28%,#D62976 58%,#962FBF 82%,#4F5BD5)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2"><rect x="3.5" y="3.5" width="17" height="17" rx="5.5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1.2" fill="#fff" stroke="none"/></svg></div>`;
}
const LIVE=["分发中","已发布","优化中"];
const statuses=["待排期","制作中","分发中","已发布","优化中"];
const stages=["内容策略","素材生产","多渠道分发","再优化","数据反馈"];
const categories=["OCTAVE 品牌宣传片","Retreat Program 短视频","学院课程短视频","品牌动态海报","八大生活习惯视频号","异业合作内容","KOL / IP 联名内容"];

/* 自定义瓦片下拉：返回元素，带 getValue() 和 'change' 事件 */
function dropdown(opts, sel, o={}){
  const wrap=document.createElement('div');
  wrap.className='dd'+(o.sm?' sm':'')+(o.up?' up':'');
  const trig=document.createElement('button'); trig.type='button'; trig.className='dd-trig';
  const pop=document.createElement('div'); pop.className='dd-pop';
  const grid=document.createElement('div'); grid.className='dd-grid';
  let cur=sel;
  const paint=()=>{ trig.innerHTML=(o.dot?`<span class="dd-dot" style="background:${(o.colors||{})[cur]||'#94A3B8'}"></span>`:'')
      +`<span class="dd-val">${cur}</span><i class="cv"></i>`; };
  opts.forEach(op=>{
    const t=document.createElement('span'); t.className='dd-opt'+(op===cur?' on':''); t.textContent=op;
    t.addEventListener('click',e=>{ e.stopPropagation(); cur=op;
      grid.querySelectorAll('.dd-opt').forEach(x=>x.classList.remove('on')); t.classList.add('on');
      paint(); wrap.classList.remove('open'); wrap.dispatchEvent(new CustomEvent('change',{detail:op})); });
    grid.appendChild(t);
  });
  pop.appendChild(grid); paint();
  trig.addEventListener('click',e=>{ e.stopPropagation(); const open=wrap.classList.contains('open');
    document.querySelectorAll('.dd.open').forEach(d=>d.classList.remove('open')); if(!open)wrap.classList.add('open'); });
  wrap.appendChild(trig); wrap.appendChild(pop);
  wrap.getValue=()=>cur;
  return wrap;
}
document.addEventListener('click',()=>document.querySelectorAll('.dd.open').forEach(d=>d.classList.remove('open')));

// 表单下拉
document.getElementById('dd-cat').appendChild(dropdown(categories,"OCTAVE 品牌宣传片"));
document.getElementById('dd-stage').appendChild(dropdown(stages,"内容策略"));
document.getElementById('dd-status').appendChild(dropdown(statuses,"待排期"));

// 渠道行：logo + 状态瓦片下拉(带色点,向上展开) + 指标按状态锁定
const channels=[["微信","wx"],["小红书","xhs"],["Instagram","ig"]];
const host=document.getElementById('chans');
channels.forEach(([nm,b])=>{
  const row=document.createElement('div'); row.className='chan-row';
  row.innerHTML=`<div class="chan-name">${chLogo(b)}${nm}</div><span class="dd-mount"></span>`
    +[0,0,0,0,0].map(()=>`<input class="minp zero" value="0" inputmode="numeric" disabled>`).join("");
  host.appendChild(row);
  const dd=dropdown(statuses,"待排期",{dot:true,colors:STATUS,sm:true,up:true});
  row.querySelector('.dd-mount').replaceWith(dd);
  const mins=[...row.querySelectorAll('.minp')];
  const lock=()=>{ const live=LIVE.includes(dd.getValue());
    mins.forEach(m=>{ m.disabled=!live; if(!live){m.value='0';m.classList.add('zero');} }); };
  dd.addEventListener('change',lock); lock();
});
// 0 值灰显（启用态）
document.querySelectorAll('.minp').forEach(el=>{
  el.addEventListener('focus',()=>el.classList.remove('zero'));
  el.addEventListener('blur',()=>el.classList.toggle('zero',el.value==='0'||el.value===''));
});

// 表现分：实时分段配色（≥85 绿 / 70–84 蓝 / <70 橙）
const scoreInp=document.getElementById('scoreInp');
const sdotI=document.querySelector('.scoredot i'), sdotT=document.querySelector('.scoredot .bt');
function band(v){v=+v||0; return v>=85?["#3FB36A","85+ · 优秀"]:v>=70?["#49B6D8","70–84 · 良好"]:["#FF9F6E","<70 · 需优化"];}
function syncScore(){const[c,t]=band(scoreInp.value); sdotI.style.background=c; sdotT.textContent=t; sdotT.style.color=c; scoreInp.style.color=c;}
scoreInp.addEventListener('input',syncScore); syncScore();

// 标签 chips：回车 / 逗号 添加，× 删除
const tagsBox=document.getElementById('tags'), tagin=document.getElementById('tagin');
function addChip(t){t=(t||'').replace(/[，,]/g,'').trim(); if(!t)return;
  const c=document.createElement('span'); c.className='chip';
  c.innerHTML='<b></b><span class="rm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></span>';
  c.querySelector('b').textContent=t;
  c.querySelector('.rm').onclick=()=>c.remove();
  tagsBox.insertBefore(c,tagin);}
["品牌","海外","线索"].forEach(addChip);
tagin.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===','||e.key==='，')&&tagin.value.trim()){e.preventDefault();addChip(tagin.value);tagin.value='';}
  else if(e.key==='Backspace'&&!tagin.value){const chips=tagsBox.querySelectorAll('.chip'); if(chips.length)chips[chips.length-1].remove();}
});

// 必填校验
const titleInp=document.getElementById('titleInp'), titleErr=document.getElementById('titleErr');
document.querySelector('.btn-primary').addEventListener('click',()=>{
  if(!titleInp.value.trim()){
    titleInp.classList.add('err','shake'); titleErr.classList.add('show'); titleInp.focus();
    setTimeout(()=>titleInp.classList.remove('shake'),320);
  }else{ titleErr.classList.remove('show'); }
});
titleInp.addEventListener('input',()=>{titleInp.classList.remove('err'); titleErr.classList.remove('show');});
document.querySelector('.xbtn').addEventListener('click',()=>{});
</script>
</body>
</html>
