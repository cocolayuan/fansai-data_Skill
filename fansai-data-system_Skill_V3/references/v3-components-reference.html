<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FansAI V3 · 组件参考</title>
<link rel="stylesheet" href="../assets/components/dropdown.css">
<style>
:root{--ink:#1b2430;--muted:#64748b;--line:#e8efef;--accent:#008aa8;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);font-size:14px}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(900px 520px at 12% -6%,rgba(154,220,203,.42),transparent 62%),radial-gradient(760px 480px at 88% 4%,rgba(73,182,216,.30),transparent 60%),#ECF4F2}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #49b6d8;outline-offset:3px}main{max-width:1200px;margin:auto;padding:32px 36px}header{display:flex;align-items:center;gap:12px;margin-bottom:28px}h1{font-size:26px;margin:0;font-weight:650}.badge{border:0;border-radius:8px;background:#fff;padding:5px 9px;color:#64748b;font-size:12px}.panel{background:rgba(255,255,255,.84);border-radius:24px;overflow:hidden;margin-bottom:24px}.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:22px 26px}.bar h2{font-size:18px;margin:0 auto 0 0}.btn{border:1px solid var(--line);background:white;border-radius:12px;padding:11px 18px;color:var(--ink)}.launch{background:#45565f;color:white;border:0;font-weight:500}.launch:hover{background:#344750}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:660px}th,td{text-align:left;padding:20px 26px;border-bottom:1px solid #e8eff2}th{font-size:12px;color:#64748b;font-weight:500;background:#fbfcfd}tr:nth-child(odd) td{background:#f7f9fb}td strong{font-weight:600}td small{display:block;color:#64748b;margin-top:8px}.amount{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}.status{display:inline-block;border-radius:8px;background:#fdf1e3;color:#C77B26;padding:5px 10px;font-size:12px}output{display:block;margin:18px 26px;color:#64748b}.transfer{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:0 26px 22px}.transfer .dd{width:230px}.primary{background:var(--ink);border:0;color:#fff}.btn:disabled{background:#eef1f4;border-color:transparent;color:#94a3b8;cursor:not-allowed}dialog{padding:0;border:0;background:transparent;width:min(984px,calc(100vw - 32px));max-width:none;max-height:none;overflow:visible;color:var(--ink)}dialog::backdrop{background:rgba(38,56,67,.24);backdrop-filter:blur(8px)}.frame{display:flex;flex-direction:column;max-height:calc(100dvh - 48px);border-radius:28px;overflow:hidden;background:rgba(241,246,246,.96);box-shadow:0 32px 90px -30px rgba(25,44,58,.30)}.mhead{padding:24px 30px 18px;display:flex;align-items:center;gap:20px}.mhead h2{font-size:20px;margin:0;flex:1;font-weight:600}.close{border:0;background:rgba(255,255,255,.8);width:36px;height:36px;border-radius:10px;font-size:24px;color:#64748b}.mbody{min-height:0;overflow:auto;padding:0 30px 30px;container-type:inline-size}.picker-tools{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:4px 0 24px}.picker-tools .dd{width:164px}.search{width:220px;min-width:0;border:0;border-radius:12px;background:#fff;padding:12px 14px;font:inherit;color:var(--ink)}.entries{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}.entry{min-width:0;border:0;border-radius:18px;background:#fff;padding:12px;text-align:left;color:var(--ink);transition:box-shadow .15s}.entry:hover{box-shadow:0 12px 30px -20px rgba(25,44,58,.4)}.entry img{display:block;width:100%;aspect-ratio:2.5;object-fit:contain;border-radius:10px}.entry strong{display:block;font-size:16px;font-weight:600;margin:13px 6px 6px}.entry>span{display:block;font-size:12px;color:#64748b;line-height:1.5;margin:0 6px 6px}.entry[hidden]{display:none}.empty{color:#64748b;padding:30px;text-align:center}.empty[hidden]{display:none}@container(max-width:847px){.entries{grid-template-columns:repeat(2,minmax(0,1fr))}}@container(max-width:555px){.entries{grid-template-columns:1fr}}@container(max-width:263px){.entry img{display:none}}@media(max-width:600px){main{padding:24px 16px}.mhead{padding:22px 20px 18px}.mbody{padding:0 20px 24px}.picker-tools{flex-wrap:wrap}.search{width:100%}.frame{max-height:calc(100dvh - 32px)}.bar,.transfer{padding-left:20px;padding-right:20px}.transfer .dd{flex:1 1 200px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<main><header><h1>审批组件</h1><span class="badge">V3 · 示例</span></header>
<section class="panel"><div class="bar"><h2>待审批</h2><div id="typeFilter"></div><div id="statusFilter"></div><button class="btn launch" id="launch">＋ 发起审批</button></div><div class="table-wrap"><table><thead><tr><th>审批事项</th><th>申请人</th><th class="amount">金额（元）</th><th>状态</th></tr></thead><tbody><tr><td><strong>品牌秋季内容项目立项</strong><small>立项审批 · 星图科技</small></td><td>林悦</td><td class="amount">480,000</td><td><span class="status">待审批</span></td></tr></tbody></table></div><output id="filterResult" aria-live="polite">全部审批类型 · 全部状态</output></section>
<section class="panel"><div class="bar"><h2>转交同事</h2></div><div class="transfer"><div id="coworker"></div><button class="btn primary" id="confirm" disabled>确认转交</button></div><output id="transferResult" aria-live="polite">组件示例，仅本页生效</output></section></main>
<dialog id="picker" aria-labelledby="pickerTitle"><div class="frame"><div class="mhead"><h2 id="pickerTitle">选择审批事项</h2><button class="close" aria-label="关闭">×</button></div><div class="mbody"><div class="picker-tools"><div id="category"></div><input class="search" aria-label="搜索审批事项" placeholder="搜索审批事项"></div><div class="entries"><button class="entry" aria-labelledby="title-project-initiation" aria-describedby="desc-project-initiation" data-name="立项审批"><img src="../assets/banner-png-2x/01-project-initiation.png" alt=""><strong id="title-project-initiation">立项审批</strong><span id="desc-project-initiation">创建项目并提交立项资料</span></button><button class="entry" aria-labelledby="title-contract-approval" aria-describedby="desc-contract-approval" data-name="合同审批"><img src="../assets/banner-png-2x/02-contract-approval.png" alt=""><strong id="title-contract-approval">合同审批</strong><span id="desc-contract-approval">选择项目并提交合同与用章信息</span></button><button class="entry" aria-labelledby="title-delivery-approval" aria-describedby="desc-delivery-approval" data-name="交付审批"><img src="../assets/banner-png-2x/03-delivery-approval.png" alt=""><strong id="title-delivery-approval">交付审批</strong><span id="desc-delivery-approval">登记交付内容与客户评价</span></button><button class="entry" aria-labelledby="title-invoice-request" aria-describedby="desc-invoice-request" data-name="开票申请"><img src="../assets/banner-png-2x/04-invoice-request.png" alt=""><strong id="title-invoice-request">开票申请</strong><span id="desc-invoice-request">选择已签约项目并填写开票信息</span></button><button class="entry" aria-labelledby="title-external-payment" aria-describedby="desc-external-payment" data-name="对外付款"><img src="../assets/banner-png-2x/05-external-payment.png" alt=""><strong id="title-external-payment">对外付款</strong><span id="desc-external-payment">选择项目和收款方，发起付款</span></button><button class="entry" aria-labelledby="title-supplier-contract" aria-describedby="desc-supplier-contract" data-name="供应商合同"><img src="../assets/banner-png-2x/06-supplier-contract.png" alt=""><strong id="title-supplier-contract">供应商合同</strong><span id="desc-supplier-contract">为项目外部团队提交合同</span></button><button class="entry" aria-labelledby="title-outsourcing-contract" aria-describedby="desc-outsourcing-contract" data-name="外包合同"><img src="../assets/banner-png-2x/07-outsourcing-contract.png" alt=""><strong id="title-outsourcing-contract">外包合同</strong><span id="desc-outsourcing-contract">选择外包需求并提交合同</span></button><button class="entry" aria-labelledby="title-outsourcing-payment" aria-describedby="desc-outsourcing-payment" data-name="外包付款"><img src="../assets/banner-png-2x/08-outsourcing-payment.png" alt=""><strong id="title-outsourcing-payment">外包付款</strong><span id="desc-outsourcing-payment">针对外包需求发起付款</span></button><button class="entry" aria-labelledby="title-pre-project-agreement" aria-describedby="desc-pre-project-agreement" data-name="项目前置协议"><img src="../assets/banner-png-2x/09-pre-project-agreement.png" alt=""><strong id="title-pre-project-agreement">项目前置协议</strong><span id="desc-pre-project-agreement">与客户签署正式立项前协议</span></button></div><p class="empty" hidden>暂无匹配事项</p></div></div><div class="dropdown-portal"></div></dialog>
<script src="../assets/components/dropdown.js"></script><script>
const picker=document.querySelector('#picker');const catalog=[{"name": "立项审批", "description": "创建项目并提交立项资料", "category": "项目流程"}, {"name": "合同审批", "description": "选择项目并提交合同与用章信息", "category": "项目流程"}, {"name": "交付审批", "description": "登记交付内容与客户评价", "category": "项目流程"}, {"name": "开票申请", "description": "选择已签约项目并填写开票信息", "category": "结算与付款"}, {"name": "对外付款", "description": "选择项目和收款方，发起付款", "category": "结算与付款"}, {"name": "供应商合同", "description": "为项目外部团队提交合同", "category": "合作与采购"}, {"name": "外包合同", "description": "选择外包需求并提交合同", "category": "合作与采购"}, {"name": "外包付款", "description": "针对外包需求发起付款", "category": "结算与付款"}, {"name": "项目前置协议", "description": "与客户签署正式立项前协议", "category": "客户协议"}];
const typeMenu=dropdown(['全部审批类型',...catalog.map(x=>x.name)],'全部审批类型',{label:'审批类型',columns:2});
const statusMenu=dropdown(['全部状态','待审批'],'全部状态',{label:'审批状态',dot:true,colors:{'全部状态':'#94a3b8','待审批':'#C77B26'}});
document.querySelector('#typeFilter').append(typeMenu);document.querySelector('#statusFilter').append(statusMenu);
function filter(){const type=typeMenu.getValue();const state=statusMenu.getValue();document.querySelector('tbody tr').hidden=type!=='全部审批类型'&&type!=='立项审批';document.querySelector('#filterResult').textContent=type+' · '+state;}
typeMenu.addEventListener('change',filter);statusMenu.addEventListener('change',filter);
const colleague=dropdown([{value:'',label:'选择同事'},{value:'wang',label:'王珊 · 财务'},{value:'zhou',label:'周宁 · 法务'}],'',{label:'转交同事'});document.querySelector('#coworker').append(colleague);colleague.addEventListener('change',e=>{document.querySelector('#confirm').disabled=!e.detail;});document.querySelector('#confirm').onclick=()=>{document.querySelector('#transferResult').textContent='已转交，仅本页生效';};
const categories=dropdown(['全部','项目流程','结算与付款','合作与采购','客户协议'],'全部',{label:'审批分组',portalRoot:picker.querySelector('.dropdown-portal')});document.querySelector('#category').append(categories);
function filterCards(){const category=categories.getValue(),q=picker.querySelector('input').value.trim();let count=0;picker.querySelectorAll('.entry').forEach((button,i)=>{const item=catalog[i];button.hidden=!(category==='全部'||item.category===category)||!(item.name+item.description).includes(q);if(!button.hidden)count++;});picker.querySelector('.empty').hidden=count>0;}
categories.addEventListener('change',filterCards);picker.querySelector('input').addEventListener('input',filterCards);
document.querySelector('#launch').onclick=()=>picker.showModal();picker.querySelector('.close').onclick=()=>picker.close();picker.querySelectorAll('.entry').forEach(button=>button.onclick=()=>{picker.close();document.querySelector('#transferResult').textContent='已选择'+button.dataset.name+'；此页仅演示组件';});
</script></html>
