<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>创作者列表 · Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b2430; --ink2:#0f3132; --muted:#64748b; --muted2:#94a3b8;
  --teal:#008aa8; --teal2:#0c7074; --blue:#49B6D8; --lime:#A7E885;
  --line:#e8efef;
  --ok:#1A9E4B; --warn:#C77B26; --err:#D6455B; --info:#2563EB;
  --cn:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --en:"Outfit","Noto Sans SC",sans-serif;
  --glass:0 24px 54px -28px rgba(20,60,60,.26), inset 0 1px 0 rgba(255,255,255,.65);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--cn);font-weight:500;color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;
  background:
   radial-gradient(1200px 720px at 92% -8%, rgba(73,182,216,.17), transparent 58%),
   radial-gradient(1000px 700px at -2% 6%, rgba(139,217,140,.17), transparent 55%),
   radial-gradient(900px 560px at 60% 104%, rgba(0,138,168,.10), transparent 60%),
   #ECF4F2;
  background-attachment:fixed}
.tnum{font-variant-numeric:tabular-nums}
.wrap{max-width:1680px;margin:0 auto;padding:26px 36px 60px}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rv{opacity:0;animation:up .5s cubic-bezier(.2,.7,.2,1) forwards}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.72),rgba(255,255,255,.5));backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid rgba(255,255,255,.78);box-shadow:var(--glass)}

/* header */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.bcrumb{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:20px;background:#fff;border:2px solid #f5fffe;box-shadow:0 6px 18px -10px rgba(15,49,50,.18)}
.bdot{width:12px;height:12px;border-radius:50%;background:linear-gradient(140deg,#9ADCCB,#49B6D8);flex:0 0 auto}
.bmain{font-family:var(--en);font-weight:700;font-size:18px;letter-spacing:1.08px;line-height:24px}
.tb-right{display:flex;align-items:center;gap:12px}
.bellbtn{width:42px;height:42px;border-radius:50%;border:2px solid #f5fffe;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px -10px rgba(15,49,50,.18);cursor:pointer;transition:.2s}
.bellbtn:hover{transform:translateY(-1px)}
.me{display:flex;align-items:center;gap:8px;cursor:pointer}
.avatar{width:42px;height:42px;border-radius:50%;border:2px solid #f5fffe;background:linear-gradient(140deg,#A7E885,#008aa8);color:#04312f;font-family:var(--en);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center}
.mename{font-family:var(--en);font-weight:500;font-size:18px}

/* tabs */
.navrow{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.subnav{display:flex;align-items:center;gap:6px;padding:6px;border-radius:18px;width:fit-content;background:rgba(255,255,255,.55);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.7)}
.stab{border:none;background:none;padding:9px 20px;border-radius:13px;font-family:var(--cn);font-weight:500;font-size:14px;color:var(--muted);cursor:pointer;transition:.18s;white-space:nowrap}
.stab.on{background:var(--ink);color:#fff;font-weight:600;box-shadow:0 10px 22px -10px rgba(15,49,50,.4)}
.stab:not(.on):hover{color:var(--ink);background:rgba(255,255,255,.6)}

/* toolbar */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.tr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.searchbox{display:flex;align-items:center;gap:9px;border-radius:14px;padding:11px 16px;background:rgba(255,255,255,.62);border:1px solid var(--line);width:300px}
.searchbox svg{width:15px;height:15px;color:var(--muted2);flex:0 0 auto}
.searchbox input{border:0;outline:0;background:transparent;font-family:var(--cn);font-size:13.5px;width:100%;color:var(--ink)}
.searchbox input::placeholder{color:var(--muted2)}
.resetbtn{display:flex;align-items:center;gap:7px;padding:11px 16px;border-radius:14px;font-family:var(--cn);font-size:13.5px;font-weight:600;
  color:var(--muted);background:rgba(255,255,255,.62);border:1px solid var(--line);cursor:pointer;transition:.16s}
.resetbtn svg{width:13px;height:13px}
.resetbtn:hover{color:var(--ink);border-color:#cfe0e0;background:#fff}
.aibtn{display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:14px;font-family:var(--cn);font-size:13.5px;font-weight:700;
  color:var(--teal2);background:rgba(0,138,168,.08);border:1px solid rgba(0,138,168,.2);cursor:pointer;transition:.16s}
.aibtn svg{width:15px;height:15px}
.aibtn:hover{background:rgba(0,138,168,.14);transform:translateY(-1px)}
.createbtn{display:flex;align-items:center;gap:8px;padding:11px 20px;border-radius:14px;font-family:var(--cn);font-size:13.5px;font-weight:700;
  color:#fff;background:var(--ink);border:none;cursor:pointer;transition:.18s;box-shadow:0 14px 28px -14px rgba(20,30,40,.5)}
.createbtn svg{width:14px;height:14px}
.createbtn:hover{transform:translateY(-1px)}

/* tile dropdown */
.dd{position:relative}
.dd-trig{display:flex;align-items:center;gap:9px;font-family:var(--cn);font-weight:500;font-size:13.5px;color:var(--ink);
  background:rgba(255,255,255,.62);border:1px solid var(--line);border-radius:14px;padding:11px 16px;cursor:pointer;transition:.18s;min-width:140px}
.dd.open .dd-trig{border-color:var(--blue);box-shadow:0 0 0 4px rgba(73,182,216,.16);background:#fff}
.dd-trig .cv{width:7px;height:7px;border-right:1.8px solid var(--muted2);border-bottom:1.8px solid var(--muted2);transform:rotate(45deg);margin-top:-3px;margin-left:auto;transition:transform .2s}
.dd.open .dd-trig .cv{transform:rotate(225deg);margin-top:2px}
.dd-trig .dd-dot,.dd-opt .dd-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.dd-pop{position:absolute;top:calc(100% + 8px);left:0;min-width:190px;z-index:30;background:#fff;border:1px solid var(--line);
  border-radius:14px;box-shadow:0 20px 48px -18px rgba(15,49,50,.34);padding:8px;display:none;animation:ddIn .16s ease}
.dd.open .dd-pop{display:block}
.dd-opt{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;transition:.15s}
.dd-opt:hover{background:rgba(0,138,168,.06)}
.dd-opt.on{background:rgba(73,182,216,.1);color:var(--ink);font-weight:700}
@keyframes ddIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ===== 创作者卡片（替代原来拥挤的表格行） ===== */
.clist{display:flex;flex-direction:column;gap:16px}
/* 左栏文字宽度收窄，作品区再放大占比，右侧信息栏适度收紧腾出空间 */
.ccard{border-radius:22px;padding:24px 26px;display:grid;grid-template-columns:minmax(0,1fr) 620px 210px;gap:24px;transition:.22s}
.ccard:hover{transform:translateY(-2px);box-shadow:0 30px 60px -30px rgba(20,60,60,.34)}

/* 左：博主简介 */
.cmain{display:flex;gap:16px;min-width:0}
.cav-wrap{position:relative;flex:0 0 auto;width:64px}
.cav{position:relative;width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#fff;
  font-weight:700;font-size:20px;box-shadow:0 10px 22px -10px rgba(20,60,60,.5);overflow:hidden}
.cav-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* 等级徽标改放到名称行（名字 + 个人 之后） */
.cgrade{display:inline-flex;align-items:center;white-space:nowrap;padding:3px 10px;border-radius:9px;
  background:var(--ink);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.2px;box-shadow:0 6px 14px -8px rgba(0,0,0,.5)}
.cbody{min-width:0;flex:1}
.cname-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.cname{font-size:16px;font-weight:700;color:var(--ink)}
.ctype{font-size:11px;font-weight:600;color:var(--muted);background:rgba(148,163,184,.14);border-radius:8px;padding:3px 9px}
.clink{width:24px;height:24px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--muted2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.clink svg{width:12px;height:12px}
.clink:hover{color:var(--teal);border-color:rgba(0,138,168,.35)}
.cmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px}
.cmeta .mv{font-family:var(--en);font-weight:700;color:var(--ink)}
.cmeta .sep{color:#cfdcda}
.cplat{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:9px}
.cplat .pdot{width:6px;height:6px;border-radius:50%}
.cslogan{font-size:13px;color:var(--ink);font-weight:600;margin-bottom:7px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cdetail{font-size:12px;color:var(--muted);line-height:1.65;margin-bottom:7px}
.cdesc{font-size:12.5px;color:var(--muted);line-height:1.7;margin-bottom:12px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ctags{display:flex;gap:7px;flex-wrap:wrap}
.ctag{font-size:11px;font-weight:600;color:var(--teal2);background:rgba(0,138,168,.08);border:1px solid rgba(0,138,168,.15);border-radius:9px;padding:4px 10px}

/* 中：作品 */
.cworks{min-width:0}
.csub{font-size:11px;font-weight:700;color:var(--muted2);letter-spacing:.4px;margin-bottom:11px;text-transform:uppercase;font-family:var(--en)}
/* 固定两列并排，作品图更大 */
.wgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.wthumb{position:relative;width:100%;aspect-ratio:16/10;border-radius:15px;overflow:hidden;cursor:pointer;transition:.18s;
  border:1px solid rgba(255,255,255,.6);box-shadow:0 12px 26px -14px rgba(20,60,60,.5)}
.wthumb:hover{transform:translateY(-2px) scale(1.02)}
.wthumb .wbg{position:absolute;inset:0}
.wthumb .wimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.wthumb .wveil{position:absolute;inset:0;background:linear-gradient(160deg,rgba(10,30,32,.18),rgba(10,30,32,.55))}
.wthumb .wplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px -6px rgba(0,0,0,.5)}
.wthumb .wplay svg{width:14px;height:14px;color:var(--ink);margin-left:2px}
.wthumb .wplat{position:absolute;left:8px;bottom:8px;font-size:10px;font-weight:700;color:#fff;padding:3px 9px;border-radius:8px;backdrop-filter:blur(4px)}
.wthumb .wcount{position:absolute;right:8px;top:8px;min-width:24px;height:21px;padding:0 7px;border-radius:10px;background:rgba(15,30,32,.72);
  color:#fff;font-family:var(--en);font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.wempty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:100%;min-height:146px;border-radius:15px;
  border:1px dashed #d5e2e0;background:rgba(255,255,255,.4);color:var(--muted2);font-size:12px}
.wempty svg{width:24px;height:24px;color:#c9d6d4}

/* 右：商务信息 + 操作 */
.cside{display:flex;flex-direction:column;gap:14px;border-left:1px solid var(--line);padding-left:24px}
.sfield{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sfield .sk{font-size:11.5px;color:var(--muted2);font-weight:600;flex:0 0 auto;display:flex;align-items:center;gap:5px}
.sfield .sv{font-size:13px;font-weight:700;color:var(--ink);text-align:right;word-break:break-all}
.sfield .sv.na{color:var(--muted2);font-weight:500}
.sfield .sv.mono{font-family:var(--en)}
/* 示例数据标记：明确区分"演示占位值"与真实字段 */
.demotag{font-size:9px;font-weight:700;color:var(--warn);background:#FDF1E3;border-radius:5px;padding:1px 5px;letter-spacing:.2px;cursor:help}
/* 价格带：按内容形式分行展示 */
.pricebox{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.pricerow{display:inline-flex;align-items:baseline;gap:7px}
.pricerow .pk{font-size:10.5px;color:var(--muted2);font-weight:600}
.pricerow .pv{font-family:var(--en);font-size:14px;font-weight:700;color:var(--ink)}
.statusrow{margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:12px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill .pd{width:6px;height:6px;border-radius:50%}
.opgroup{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.opicon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  background:rgba(255,255,255,.7);border:1px solid var(--line);color:var(--muted);cursor:pointer;transition:.16s;position:relative}
.opicon svg{width:17px;height:17px}
.opicon:hover{color:var(--teal);border-color:rgba(0,138,168,.35);background:#fff;transform:translateY(-1px);box-shadow:0 10px 20px -12px rgba(0,138,168,.4)}
.opicon.danger:hover{color:var(--err);border-color:rgba(214,69,91,.35);box-shadow:0 10px 20px -12px rgba(214,69,91,.4)}
.opicon .otip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  font-size:11px;font-weight:600;padding:5px 9px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .14s;z-index:5}
.opicon:hover .otip{opacity:1}
.opdivider{width:1px;height:22px;background:var(--line);flex:0 0 auto}
.opcta{display:inline-flex;align-items:center;padding:9px 18px;border-radius:13px;font-family:var(--cn);font-size:12.5px;font-weight:700;
  color:#fff;background:var(--ink);border:none;cursor:pointer;transition:.16s;white-space:nowrap;box-shadow:0 12px 22px -12px rgba(20,30,40,.55)}
.opcta:hover{transform:translateY(-1px)}

.emptybox{border-radius:22px;padding:60px 20px;text-align:center;color:var(--muted2);font-size:13px}

/* footer */
.lfoot{display:flex;align-items:center;justify-content:space-between;margin-top:20px;flex-wrap:wrap;gap:10px}
.lfoot .note{font-size:11.5px;color:var(--muted2)}
.lfoot .note b{font-family:var(--en);color:var(--ink)}
.pager{display:flex;align-items:center;gap:6px}
.pgbtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.6);color:var(--muted);display:flex;align-items:center;justify-content:center;font-family:var(--en);font-weight:600;font-size:12.5px;cursor:pointer;transition:.15s}
.pgbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pgbtn[disabled]{opacity:.4;cursor:not-allowed}
.pgbtn:not([disabled]):not(.on):hover{border-color:#cfe0e0;color:var(--ink)}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:14px;font-size:13px;font-weight:500;box-shadow:0 20px 40px -14px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.28s;z-index:80;max-width:600px;text-align:center;line-height:1.6}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1500px){
  .ccard{grid-template-columns:minmax(0,1fr) 460px}
  .cside{grid-column:1 / -1;border-left:none;border-top:1px solid var(--line);padding-left:0;padding-top:18px;flex-direction:row;align-items:center;gap:26px}
  .cside .sfield{flex-direction:column;align-items:flex-start;gap:3px}
  .cside .sfield .sv{text-align:left}
  .opgroup{margin-left:auto;margin-top:0;padding-top:0}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar rv">
    <div class="bcrumb"><span class="bdot"></span><span class="bmain">创作者列表</span></div>
    <div class="tb-right">
      <button class="bellbtn" title="消息通知">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9a6 6 0 10-12 0c0 6-2.5 7-2.5 7h17S18 15 18 9z"/><path d="M10.3 20a2 2 0 003.4 0"/></svg>
      </button>
      <div class="me">
        <div class="avatar">K</div><span class="mename">Kora</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color:#64748b"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>
  </header>

  <div class="navrow rv" style="animation-delay:.02s">
    <div class="subnav" id="subnav"></div>
  </div>

  <div class="toolbar rv" style="animation-delay:.06s">
    <div class="searchbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="searchInput" placeholder="搜索账号名称 / 标签 / 简介">
    </div>
    <div class="tr">
      <div id="ddType"></div>
      <div id="ddGrade"></div>
      <div id="ddCoop"></div>
      <button class="resetbtn" id="resetBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7"/><path d="M21 3v6h-6"/></svg>
        重置
      </button>
      <button class="aibtn" id="aiBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9L12 3z"/><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8.8-2z"/></svg>
        智能增补
      </button>
      <button class="createbtn" id="createBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        新建创作者
      </button>
    </div>
  </div>

  <div class="clist" id="clist"></div>

  <div class="lfoot">
    <div class="note" id="pageNote"></div>
    <div class="pager" id="pager"></div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
/* ============ 数据（全部来自「创作者列表」页截图，未新增字段）
   源页脚显示「共 9 条，1 页」，截图中可完整读取的为前 4 位，其余未展开不做编造。

   ★ 作品封面图接入方式：
     给 works 里的某一项加 img 字段即可自动换成真实封面，留空则显示平台色占位块：
        works:[{plat:'小红书', img:'assets/works/heian-01.jpg'}, ...]
     推荐把图片放到 assets/works/ 本地目录（平台 CDN 大多有防盗链，直接外链会 403）。
     avatar 字段同理，可为创作者接入真实头像：avatar:'assets/avatars/xxx.jpg'
     homepage 字段填主页链接后，右上角箭头按钮会真实跳转。
 ============ */
const CREATORS = [
 {
   name:'禾安', type:'个人', grade:'B级博主', platform:'小红书',
   region:'河南',
   stats:[['粉丝','1千+'],['关注','10+'],['赞藏','1万+'],['笔记','10']],
   slogan:'每日好剧分享✨',
   detail:'小红书号 5216515596 · 获赞 1万+',
   desc:'擅长经典及热门国产电视剧的剪辑与趣味解说，专注剖析剧中的名场面、角色人设与抓马台词。',

/* ⚠ price 为 Ted 指定填充的**示例报价**，源页面该列全部为「—」。
   界面上已用「示例」标记标注，避免后续被误当成真实报价。 */
const TOTAL_CREATORS = 9;   // 源页脚：共 9 条，1 页
const READABLE = CREATORS.length;

const TABS=['创作者列表','供应商列表'];

const PLAT_STYLE = {
 '小红书':   {bg:'#FDE9EC', fg:'#FF2442', solid:'linear-gradient(150deg,#FF6B81,#E8143A)'},
 '哔哩哔哩': {bg:'#E4F4FB', fg:'#00A1D6', solid:'linear-gradient(150deg,#5FD0F5,#0091C8)'},
};
const COOP_STYLE = {
 '潜在': {bg:'#F1F4F4', fg:'#94A3B8'},
 '合作中': {bg:'#E0F4F8', fg:'#008AA8'},
 '待合作': {bg:'#FDF1E3', fg:'#C77B26'},
};
const AV_PALETTE=[
 'linear-gradient(140deg,#A7E885,#008aa8)',
 'linear-gradient(140deg,#5CC0DE,#2563EB)',
 'linear-gradient(140deg,#F5C36B,#E8854A)',
 'linear-gradient(140deg,#F48FB1,#C2447A)',
 'linear-gradient(140deg,#9DB4F5,#5C5CD6)',
];
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return h; }
function avGrad(n){ return AV_PALETTE[hashStr(n)%AV_PALETTE.length]; }
/* 个性签名超过30字截断，避免长文案挤占卡片布局 */
function truncate(s,n){ if(!s) return s; return s.length>n ? s.slice(0,n)+'…' : s; }
/* 粉丝数等纯数字加千分位；「1千+」「1万+」这类原文字符串保持原样不做换算 */
function fmtStat(v){ return /^\d+$/.test(v) ? Number(v).toLocaleString('en-US') : v; }

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(window.__tt); window.__tt=setTimeout(()=>t.classList.remove('show'),2600);
}

/* ============ tabs ============ */
const subnav=document.getElementById('subnav');
TABS.forEach((t,i)=>{
  const b=document.createElement('button'); b.className='stab'+(i===0?' on':''); b.textContent=t;
  b.onclick=()=>{
    document.querySelectorAll('.stab').forEach(x=>x.classList.remove('on')); b.classList.add('on');
    if(i===1) toast('「供应商列表」为独立页面，请打开 供应商列表_redesign.html 查看');
  };
  subnav.appendChild(b);
});

/* ============ 筛选 ============ */
let fType='全部账号类型', fGrade='全部等级', fCoop='全部合作状态', searchQ='', currentPage=1;
const TYPE_OPTS=['全部账号类型', ...Array.from(new Set(CREATORS.map(c=>c.type)))];
const GRADE_OPTS=['全部等级', ...Array.from(new Set(CREATORS.map(c=>c.grade)))];
const COOP_OPTS=['全部合作状态', ...Array.from(new Set(CREATORS.map(c=>c.coop)))];

function buildDD(mountId, opts, getVal, setVal, dotFor){
  const wrap=document.createElement('div'); wrap.className='dd';
  const trig=document.createElement('button'); trig.type='button'; trig.className='dd-trig';
  const pop=document.createElement('div'); pop.className='dd-pop';
  function dotHtml(v){ const c=dotFor?dotFor(v):null; return c?`<span class="dd-dot" style="background:${c}"></span>`:''; }
  function paint(){ trig.innerHTML = dotHtml(getVal()) + `<span>${getVal()}</span><i class="cv"></i>`; }
  opts.forEach(o=>{
    const el=document.createElement('div'); el.className='dd-opt'+(o===getVal()?' on':''); el.dataset.v=o;
    el.innerHTML = dotHtml(o) + `<span>${o}</span>`;
    el.onclick=(e)=>{ e.stopPropagation(); setVal(o); currentPage=1;
      pop.querySelectorAll('.dd-opt').forEach(x=>x.classList.toggle('on', x.dataset.v===o));
      paint(); wrap.classList.remove('open'); renderList(); };
    pop.appendChild(el);
  });
  trig.onclick=(e)=>{ e.stopPropagation(); const open=wrap.classList.contains('open');
    document.querySelectorAll('.dd.open').forEach(d=>d.classList.remove('open')); if(!open) wrap.classList.add('open'); };
  paint(); wrap.append(trig,pop);
  document.getElementById(mountId).appendChild(wrap);
  wrap.repaint=()=>{ paint(); pop.querySelectorAll('.dd-opt').forEach(x=>x.classList.toggle('on', x.dataset.v===getVal())); };
  return wrap;
}
const ddType = buildDD('ddType', TYPE_OPTS, ()=>fType, v=>fType=v, null);
const ddGrade= buildDD('ddGrade',GRADE_OPTS,()=>fGrade,v=>fGrade=v, null);
const ddCoop = buildDD('ddCoop', COOP_OPTS, ()=>fCoop, v=>fCoop=v, v=>COOP_STYLE[v]?COOP_STYLE[v].fg:null);
document.addEventListener('click', ()=>document.querySelectorAll('.dd.open').forEach(d=>d.classList.remove('open')));

document.getElementById('searchInput').addEventListener('input', e=>{ searchQ=e.target.value.trim().toLowerCase(); currentPage=1; renderList(); });
document.getElementById('resetBtn').onclick=()=>{
  fType='全部账号类型'; fGrade='全部等级'; fCoop='全部合作状态'; searchQ=''; currentPage=1;
  document.getElementById('searchInput').value='';
  ddType.repaint(); ddGrade.repaint(); ddCoop.repaint();
  renderList(); toast('已重置筛选与搜索');
};
document.getElementById('aiBtn').onclick=()=>toast('「智能增补」用于自动补全创作者资料（原型演示，暂未接入真实能力）');
document.getElementById('createBtn').onclick=()=>toast('「新建创作者」为原型演示按钮，暂未接入真实创建流程');

/* ============ 渲染创作者卡片 ============ */
const ICON_VIEW='<path d="M1 12s4-7.5 11-7.5S23 12 23 12s-4 7.5-11 7.5S1 12 1 12z"/><circle cx="12" cy="12" r="3.2"/>';
const ICON_EDIT='<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>';
const ICON_DEL='<path d="M3 6h18"/><path d="M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/>';
const ICON_LINK='<path d="M14 3h7v7"/><path d="M10 14L21 3"/><path d="M21 14v5a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h5"/>';
const ICON_PLAY='<path d="M6 4l14 8-14 8z"/>';

function getFiltered(){
  return CREATORS.filter(c=>{
    if(fType!=='全部账号类型' && c.type!==fType) return false;
    if(fGrade!=='全部等级' && c.grade!==fGrade) return false;
    if(fCoop!=='全部合作状态' && c.coop!==fCoop) return false;
    if(searchQ){
      const hay=(c.name+' '+(c.slogan||'')+' '+(c.desc||'')+' '+c.tags.join(' ')+' '+(c.contact||'')).toLowerCase();
      if(!hay.includes(searchQ)) return false;
    }
    return true;
  });
}

const PAGE_SIZE=10;
const clist=document.getElementById('clist');
function renderList(){
  const rows=getFiltered();
  const totalPages=Math.max(1, Math.ceil(rows.length/PAGE_SIZE));
  if(currentPage>totalPages) currentPage=totalPages;
  const pageRows=rows.slice((currentPage-1)*PAGE_SIZE, currentPage*PAGE_SIZE);

  clist.innerHTML='';
  if(!pageRows.length){
    clist.innerHTML=`<div class="emptybox glass">没有符合当前筛选条件的创作者</div>`;
    renderPager(totalPages, rows.length); return;
  }

  pageRows.forEach((c,i)=>{
    const plat=PLAT_STYLE[c.platform]||{bg:'#F1F4F4',fg:'#94A3B8',solid:'linear-gradient(150deg,#c8d6d4,#94a3b8)'};
    const coop=COOP_STYLE[c.coop]||{bg:'#F1F4F4',fg:'#94A3B8'};

    const statsHtml = c.stats.map(([k,v])=>`<span>${k} <span class="mv tnum">${fmtStat(v)}</span></span>`).join('<span class="sep">·</span>');
    const tagsHtml = c.tags.length ? `<div class="ctags">${c.tags.map(t=>`<span class="ctag">${t}</span>`).join('')}</div>` : '';
    // 有 img 就用真实封面，没有就退回平台色占位块（onerror 时也自动退回，不会出现裂图）
    const worksHtml = c.works.length
      ? `<div class="wgrid">${c.works.map(w=>{
          const wp=PLAT_STYLE[w.plat]||plat;
          const cover = w.img
            ? `<img class="wimg" src="${w.img}" alt="" loading="lazy" onerror="this.remove()">`
            : '';
          return `<div class="wthumb" data-plat="${w.plat}">
            <div class="wbg" style="background:${wp.solid}"></div>
            ${cover}
            <div class="wveil"></div>
            <div class="wplay"><svg viewBox="0 0 24 24" fill="currentColor">${ICON_PLAY}</svg></div>
            <span class="wplat" style="background:${wp.fg}cc">${w.plat}</span>
            ${w.count!=null?`<span class="wcount tnum">${w.count}</span>`:''}
          </div>`;
        }).join('')}</div>`
      : `<div class="wempty">
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 15l4.5-4.5 3.5 3.5 3-3L21 16"/><circle cx="8.5" cy="9.5" r="1.2"/></svg>
           暂无作品
         </div>`;

    const el=document.createElement('div');
    el.className='ccard glass rv'; el.style.animationDelay=(0.08+i*0.04)+'s';
    el.innerHTML=`
      <div class="cmain">
        <div class="cav-wrap">
          <div class="cav" style="background:${avGrad(c.name)}">${
            c.avatar ? `<img class="cav-img" src="${c.avatar}" alt="" loading="lazy" onerror="this.remove()">` : ''
          }${c.name.charAt(0)}</div>
        </div>
        <div class="cbody">
          <div class="cname-row">
            <span class="cname">${c.name}</span>
            <span class="ctype">${c.type}</span>
            <span class="cgrade">${c.grade}</span>
            <span class="clink" data-act="link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON_LINK}</svg></span>
          </div>
          <div class="cmeta">
            <span class="cplat" style="background:${plat.bg};color:${plat.fg}"><span class="pdot" style="background:${plat.fg}"></span>${c.platform}</span>
            <span class="sep">·</span><span>${c.region}</span><span class="sep">·</span>
            ${statsHtml}
          </div>
          ${c.slogan?`<div class="cslogan"${c.slogan.length>30?` title="${c.slogan.replace(/"/g,'&quot;')}"`:''}>${truncate(c.slogan,30)}</div>`:''}
          ${c.detail?`<div class="cdetail">${c.detail}</div>`:''}
          ${c.desc?`<div class="cdesc">${c.desc}</div>`:''}
          ${tagsHtml}
        </div>
      </div>

      <div class="cworks">
        <div class="csub">作品 · Works</div>
        ${worksHtml}
      </div>

      <div class="cside">
        <div class="sfield">
          <span class="sk">价格带<span class="demotag" title="源页面该列为空，此处为示例报价">示例</span></span>
          ${c.price
            ? `<span class="pricebox">${c.price.map(([k,v])=>`<span class="pricerow"><span class="pk">${k}</span><span class="pv">${v}</span></span>`).join('')}</span>`
            : `<span class="sv na">—</span>`}
        </div>
        <div class="sfield"><span class="sk">联系方式</span><span class="sv ${c.contact?'mono':'na'}">${c.contact||'—'}</span></div>
        <div class="sfield statusrow"><span class="sk">合作状态</span>
          <span class="pill" style="background:${coop.bg};color:${coop.fg}"><span class="pd" style="background:${coop.fg}"></span>${c.coop}</span></div>
        <div class="opgroup">
          <span class="opicon" data-act="view"><span class="otip">查看详情</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON_VIEW}</svg></span>
          <span class="opicon" data-act="edit"><span class="otip">编辑资料</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICON_EDIT}</svg></span>
          <span class="opicon danger" data-act="del"><span class="otip">删除</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON_DEL}</svg></span>
          <span class="opdivider"></span>
          <button class="opcta" data-act="invite">发起合作</button>
        </div>
      </div>`;

    const fansStat = c.stats.find(s=>s[0]==='粉丝');
    el.querySelector('[data-act="view"]').onclick=()=>toast(`${c.name} · ${c.platform} · ${c.grade}${fansStat?` · 粉丝 ${fmtStat(fansStat[1])}`:''} · 合作状态「${c.coop}」`);
    el.querySelector('[data-act="edit"]').onclick=()=>toast(`编辑「${c.name}」资料（原型演示，未接入编辑流程）`);
    el.querySelector('[data-act="del"]').onclick=()=>toast(`删除「${c.name}」需二次确认 —— 原型演示，不会真正删除数据`);
    el.querySelector('[data-act="link"]').onclick=()=>{
      if(c.homepage){ window.open(c.homepage,'_blank','noopener'); }
      else { toast(`「${c.name}」的${c.platform}主页链接未在源数据中提供，未做猜测跳转`); }
    };
    el.querySelector('[data-act="invite"]').onclick=()=>toast(`已向「${c.name}」发起合作邀约 —— 原型演示，不会写入实际系统`);
    el.querySelectorAll('.wthumb').forEach((t,wi)=>t.onclick=()=>toast(`预览「${c.name}」的${t.dataset.plat}作品 #${wi+1}（原型演示，源数据未提供作品链接）`));

    clist.appendChild(el);
  });
  renderPager(totalPages, rows.length);
}

function renderPager(totalPages, cnt){
  const pager=document.getElementById('pager'); pager.innerHTML='';
  const prev=document.createElement('button'); prev.className='pgbtn'; prev.textContent='‹';
  prev.disabled=currentPage<=1; prev.onclick=()=>{currentPage--;renderList();}; pager.appendChild(prev);
  for(let i=1;i<=totalPages;i++){
    const b=document.createElement('button'); b.className='pgbtn'+(i===currentPage?' on':''); b.textContent=i;
    b.onclick=()=>{currentPage=i;renderList();}; pager.appendChild(b);
  }
  const next=document.createElement('button'); next.className='pgbtn'; next.textContent='›';
  next.disabled=currentPage>=totalPages; next.onclick=()=>{currentPage++;renderList();}; pager.appendChild(next);

  const note=document.getElementById('pageNote');
  const filtering = fType!=='全部账号类型'||fGrade!=='全部等级'||fCoop!=='全部合作状态'||searchQ;
  note.innerHTML = filtering
    ? `当前筛选结果 <b>${cnt}</b> 位 / 已读取 <b>${READABLE}</b> 位`
    : `源列表共 <b>${TOTAL_CREATORS}</b> 位，此处呈现原图可完整读取的 <b>${READABLE}</b> 位`;
}
renderList();
</script>
