<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>项目管理 · Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b2430; --ink2:#0f3132; --muted:#64748b; --muted2:#94a3b8; --muted3:#727272;
  --teal:#008aa8; --teal2:#0c7074; --blue:#49B6D8; --green:#8BD98C; --lime:#A7E885;
  --green-deep:#34A85E; --green-ink:#1F6F4A; --line:#e8efef;
  --ok:#1A9E4B; --warn:#C77B26; --err:#D6455B; --errbg:#FDE9EC; --info:#2563EB; --infobg:#E4EEFB;
  --orange:#FF9F6E; --orange2:#E8854A;
  --cn:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --en:"Outfit","Noto Sans SC",sans-serif;
  --glass:0 24px 54px -28px rgba(20,60,60,.26), inset 0 1px 0 rgba(255,255,255,.65);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--cn);font-weight:500;color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;
  background:
   radial-gradient(1200px 720px at 92% -8%, rgba(73,182,216,.17), transparent 58%),
   radial-gradient(1000px 700px at -2% 6%, rgba(139,217,140,.17), transparent 55%),
   radial-gradient(900px 560px at 60% 104%, rgba(0,138,168,.10), transparent 60%),
   #ECF4F2;
  background-attachment:fixed}
.tnum{font-variant-numeric:tabular-nums}
.wrap{max-width:1680px;margin:0 auto;padding:26px 36px 60px}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rv{opacity:0;animation:up .5s cubic-bezier(.2,.7,.2,1) forwards}

.glass{background:linear-gradient(160deg,rgba(255,255,255,.72),rgba(255,255,255,.5));backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid rgba(255,255,255,.78);box-shadow:var(--glass)}

/* ===== header ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.bcrumb{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:20px;background:#fff;border:2px solid #f5fffe;box-shadow:0 6px 18px -10px rgba(15,49,50,.18)}
.bdot{width:12px;height:12px;border-radius:50%;background:linear-gradient(140deg,#9ADCCB,#49B6D8);flex:0 0 auto}
.bmain{font-family:var(--en);font-weight:700;font-size:18px;letter-spacing:1.08px;color:var(--ink);line-height:24px}
.tb-right{display:flex;align-items:center;gap:12px}
.bellbtn{width:42px;height:42px;border-radius:50%;border:2px solid #f5fffe;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px -10px rgba(15,49,50,.18);cursor:pointer;transition:.2s}
.bellbtn:hover{transform:translateY(-1px)}
.me{display:flex;align-items:center;gap:8px;cursor:pointer}
.avatar{width:42px;height:42px;border-radius:50%;border:2px solid #f5fffe;background:linear-gradient(140deg,#A7E885,#008aa8);color:#04312f;font-family:var(--en);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center}
.mename{font-family:var(--en);font-weight:500;font-size:18px;color:var(--ink)}

/* ===== toolbar ===== */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.tl{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.searchbox{display:flex;align-items:center;gap:9px;border-radius:14px;padding:11px 16px;background:rgba(255,255,255,.62);border:1px solid var(--line);width:260px}
.searchbox svg{width:15px;height:15px;color:var(--muted2);flex:0 0 auto}
.searchbox input{border:0;outline:0;background:transparent;font-family:var(--cn);font-size:13.5px;width:100%;color:var(--ink)}
.searchbox input::placeholder{color:var(--muted2)}
.resetbtn{display:flex;align-items:center;gap:7px;padding:11px 16px;border-radius:14px;font-family:var(--cn);font-size:13.5px;font-weight:600;
  color:var(--muted);background:rgba(255,255,255,.62);border:1px solid var(--line);cursor:pointer;transition:.16s}
.resetbtn svg{width:13px;height:13px}
.resetbtn:hover{color:var(--ink);border-color:#cfe0e0;background:#fff}
.resetbtn:active svg{transform:rotate(-180deg);transition:transform .35s}
.createbtn{display:flex;align-items:center;gap:8px;padding:11px 20px;border-radius:14px;font-family:var(--cn);font-size:13.5px;font-weight:700;
  color:#fff;background:var(--ink);border:none;cursor:pointer;transition:.18s;box-shadow:0 14px 28px -14px rgba(20,30,40,.5)}
.createbtn svg{width:14px;height:14px}
.createbtn:hover{transform:translateY(-1px);box-shadow:0 18px 34px -14px rgba(20,30,40,.6)}

/* ===== 自定义瓦片下拉（替代原生 select，含状态色点） ===== */
.dd{position:relative}
.dd-trig{display:flex;align-items:center;gap:9px;font-family:var(--cn);font-weight:500;font-size:13.5px;color:var(--ink);
  background:rgba(255,255,255,.62);border:1px solid var(--line);border-radius:14px;padding:11px 16px;cursor:pointer;transition:.18s;min-width:150px}
.dd.open .dd-trig{border-color:var(--blue);box-shadow:0 0 0 4px rgba(73,182,216,.16);background:#fff}
.dd-trig .cv{width:7px;height:7px;border-right:1.8px solid var(--muted2);border-bottom:1.8px solid var(--muted2);
  transform:rotate(45deg);margin-top:-3px;margin-left:auto;transition:transform .2s}
.dd.open .dd-trig .cv{transform:rotate(225deg);margin-top:2px}
.dd-trig .dd-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.dd-pop{position:absolute;top:calc(100% + 8px);left:0;min-width:200px;z-index:30;background:#fff;border:1px solid var(--line);
  border-radius:14px;box-shadow:0 20px 48px -18px rgba(15,49,50,.34);padding:8px;display:none;animation:ddIn .16s ease}
.dd.open .dd-pop{display:block}
.dd-opt{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;transition:.15s}
.dd-opt .dd-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.dd-opt:hover{background:rgba(0,138,168,.06)}
.dd-opt.on{background:rgba(73,182,216,.1);color:var(--ink);font-weight:700}
@keyframes ddIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ===== table ===== */
.tablecard{border-radius:22px;padding:10px 22px 22px}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:11.5px;font-weight:700;color:var(--muted2);letter-spacing:.3px;padding:16px 10px 10px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
thead th.sortable{cursor:pointer}
thead th.sortable:hover{color:var(--ink)}
thead th .sarrow{display:inline-block;margin-left:3px;opacity:.4;font-size:10px}
thead th.sorted .sarrow{opacity:1;color:var(--teal)}
th.num,td.num{text-align:right}
th.opcol,td.opcol{text-align:left}
tbody tr.datarow{transition:.15s}
tbody tr.datarow.zebra{background:rgba(255,255,255,.5)}
tbody tr.datarow:hover{background:rgba(0,138,168,.05)}
/* 行距加大：竖向 padding 从 14px 提到 22px，读起来不再拥挤 */
tbody td{padding:22px 10px;font-size:13.5px;border-bottom:1px solid rgba(236,243,243,.8);vertical-align:middle}
.pname{font-weight:700;color:var(--ink);cursor:pointer;line-height:1.4}
.pname:hover{color:var(--teal)}
.typetag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;color:var(--muted);background:rgba(148,163,184,.12);border-radius:9px;padding:3px 9px}
.typetag.na{color:var(--muted2);background:transparent;padding:3px 0}
.stpill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:12px;font-size:11.5px;font-weight:700;white-space:nowrap}
.stpill .pd{width:6px;height:6px;border-radius:50%}
/* 负责人：头像（按姓名 hash 确定性取色，同一人固定不随机）+ 姓名 */
.ownercell{display:flex;align-items:center;gap:9px}
.ownerav{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;
  font-family:var(--en);font-weight:700;font-size:11.5px;flex:0 0 auto;box-shadow:0 4px 10px -5px rgba(20,60,60,.4)}
.ownername{font-weight:600;color:var(--ink)}
.needlink{color:var(--teal);font-weight:600;cursor:pointer;text-decoration:none}
.needlink:hover{text-decoration:underline}
.needna{color:var(--muted2)}
.amt{font-family:var(--en);font-weight:700;font-size:13.5px;color:var(--ink)}

/* 签约日期：撕页式日历徽标——顶部「年/月」数字色条 + 下方大号日号 */
.datebadge{display:inline-flex;flex-direction:column;width:62px;border-radius:10px;overflow:hidden;border:1px solid var(--line);box-shadow:0 6px 14px -8px rgba(20,60,60,.28)}
.datebadge .db-ym{background:linear-gradient(135deg,#5CC0DE,#008aa8);color:#fff;font-family:var(--en);font-weight:600;font-size:10.5px;letter-spacing:.3px;text-align:center;padding:4px 0}
.datebadge .db-day{background:#fff;color:var(--ink);font-family:var(--en);font-weight:700;font-size:19px;text-align:center;padding:5px 0 6px;line-height:1}

/* ===== 操作：前两个是图标（保持"看起来可点"的图标态），后两个是按钮；整体左对齐，没有主操作就自然留白 ===== */
.opgroup{display:inline-flex;align-items:center;gap:8px;justify-content:flex-start}
.opicon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  background:rgba(255,255,255,.7);border:1px solid var(--line);color:var(--muted);cursor:pointer;transition:.16s;position:relative}
.opicon svg{width:17px;height:17px}
.opicon:hover{color:var(--teal);border-color:rgba(0,138,168,.35);background:#fff;transform:translateY(-1px);box-shadow:0 10px 20px -12px rgba(0,138,168,.4)}
.opdivider{width:1px;height:22px;background:var(--line);margin:0 2px;flex:0 0 auto}
/* 实施安排：次级按钮，浅底描边，无图标 */
.opsec{display:inline-flex;align-items:center;padding:9px 16px;border-radius:13px;font-family:var(--cn);font-size:12.5px;font-weight:700;
  color:var(--teal2);background:rgba(0,138,168,.08);border:1px solid rgba(0,138,168,.18);cursor:pointer;transition:.16s;white-space:nowrap}
.opsec:hover{background:rgba(0,138,168,.14);transform:translateY(-1px)}
/* 交付/立项审批：主操作，统一墨黑，无图标 */
.opcta{display:inline-flex;align-items:center;padding:9px 18px;border-radius:13px;font-family:var(--cn);font-size:12.5px;font-weight:700;
  color:#fff;background:var(--ink);border:none;cursor:pointer;transition:.16s;white-space:nowrap;box-shadow:0 12px 22px -12px rgba(20,30,40,.55)}
.opcta:hover{transform:translateY(-1px);box-shadow:0 16px 28px -12px rgba(20,30,40,.65)}

/* tooltip for icon buttons */
.opicon .otip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  font-size:11px;font-weight:600;padding:5px 9px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .14s;font-family:var(--cn)}
.opicon:hover .otip{opacity:1}

/* ===== pager ===== */
.tfoot{display:flex;align-items:center;justify-content:space-between;margin-top:16px;flex-wrap:wrap;gap:10px}
.tfoot .note{font-size:11.5px;color:var(--muted2)}
.pager{display:flex;align-items:center;gap:6px}
.pgbtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.6);color:var(--muted);display:flex;align-items:center;justify-content:center;font-family:var(--en);font-weight:600;font-size:12.5px;cursor:pointer;transition:.15s}
.pgbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pgbtn[disabled]{opacity:.4;cursor:not-allowed}
.pgbtn:not([disabled]):not(.on):hover{border-color:#cfe0e0;color:var(--ink)}

/* ===== toast ===== */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:14px;font-size:13px;font-weight:500;box-shadow:0 20px 40px -14px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.28s;z-index:80;max-width:520px;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

</style>
</head>
<body>
<div class="wrap">

  <header class="topbar rv">
    <div class="bcrumb">
      <span class="bdot"></span>
      <span class="bmain">项目管理</span>
    </div>
    <div class="tb-right">
      <button class="bellbtn" title="消息通知">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9a6 6 0 10-12 0c0 6-2.5 7-2.5 7h17S18 15 18 9z"/><path d="M10.3 20a2 2 0 003.4 0"/></svg>
      </button>
      <div class="me">
        <div class="avatar">K</div>
        <span class="mename">Kora</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color:#64748b"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>
  </header>

  <div class="toolbar rv" style="animation-delay:.03s">
    <div class="tl" id="statusDD"></div>
    <div class="tr">
      <div class="searchbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input id="searchInput" placeholder="搜索项目 / 客户 / 负责人">
      </div>
      <button class="resetbtn" id="resetBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7"/><path d="M21 3v6h-6"/></svg>
        重置
      </button>
      <button class="createbtn" id="createBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        创建项目
      </button>
    </div>
  </div>

  <div class="tablecard glass rv" style="animation-delay:.06s">
    <table>
      <thead><tr id="theadRow"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="tfoot">
      <div class="note" id="pageNote"></div>
      <div class="pager" id="pager"></div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ============ 数据（全部来自「项目管理」列表页截图，未新增字段） ============ */
const PROJECTS = [
 {name:'猫粮aigc', type:'直客', status:'执行中', cust:'百利/猫粮', owner:'Caicai', need:null, contract:100000, signDate:'2026-07-31'},
 {name:'百利', type:'直客', status:'已关闭', cust:'百利', owner:'Caicai', need:null, contract:95500, signDate:'2026-07-31'},
 {name:'百济神州 项目', type:'三方', status:'合同审核通过', cust:'百济神州', owner:'FansAI Admin', need:'出海宣传', contract:200000, signDate:'2026-07-28'},
 {name:'Songdio项目 项目', type:'三方', status:'交付完成', cust:'Songdio项目', owner:'Caicai', need:null, contract:1000000, signDate:'2026-07-29'},
 {name:'积极旬呼呼呼呼个 初始商机 项目', type:'直客', status:'合同审核通过', cust:'积极旬呼呼呼呼个', owner:'FansAI Admin', need:null, contract:1000000, signDate:'2026-07-31'},
 {name:'悦慕心情 项目', type:'直客', status:'交付完成', cust:'悦慕心情', owner:'Caicai', need:null, contract:1000000, signDate:'2026-07-28'},
 {name:'test 项目', type:'直客', status:'立项驳回', cust:'test', owner:'Caicai', need:null, contract:0, signDate:'2026-07-28'},
 {name:'耳机工厂 初始商机 项目', type:null, status:'立项审核中', cust:'耳机工厂', owner:'FansAI Admin', need:null, contract:10000000, signDate:'2026-07-27'},
 {name:'珀莱雅 初始商机 项目', type:null, status:'立项审核中', cust:'珀莱雅', owner:'Nico', need:null, contract:10000, signDate:'2026-07-24'},
 {name:'tata 初始商机 项目', type:null, status:'立项审核中', cust:'tata', owner:'Mia', need:null, contract:40000, signDate:'2026-07-24'},
];
const TOTAL_PROJECTS = 12; // 共12条，源图仅展示第1页(10条)

const STATUS_STYLE = {
 '立项审核中': {bg:'#FDF1E3', fg:'#C77B26'},
 '立项驳回':   {bg:'#FDE9EC', fg:'#D6455B'},
 '合同审核通过': {bg:'#E4EEFB', fg:'#2563EB'},
 '执行中': {bg:'#E0F4F8', fg:'#008AA8'},
 '交付完成': {bg:'#EAF6EE', fg:'#1A9E4B'},
 '已关闭': {bg:'#F1F4F4', fg:'#94A3B8'},
};
const STATUS_ORDER = ['立项审核中','立项驳回','合同审核通过','执行中','交付完成','已关闭'];

/* 主链路 5 阶段（不含「立项驳回」这个异常分支），用于「了解项目进度」的提示文案 */
const STAGE_ORDER = ['立项审核中','合同审核通过','执行中','交付完成','已关闭'];
const STAGE_LABEL = {'立项审核中':'立项','合同审核通过':'合同','执行中':'执行','交付完成':'交付','已关闭':'已关闭'};

/* 头像色板（同一姓名固定同一色，不随机） */
const AVATAR_PALETTE = [
 'linear-gradient(140deg,#A7E885,#008aa8)',
 'linear-gradient(140deg,#5CC0DE,#2563EB)',
 'linear-gradient(140deg,#F5C36B,#E8854A)',
 'linear-gradient(140deg,#F48FB1,#C2447A)',
 'linear-gradient(140deg,#8BD98C,#1A9E4B)',
];
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return h; }
function avatarGrad(name){ return AVATAR_PALETTE[hashStr(name)%AVATAR_PALETTE.length]; }

/* 审批动作：按当前状态决定按钮文案 / 点击后的下一状态（原型本地演示，不写入真实后端） */
const APPROVAL_RULES = {
 '立项审核中': {label:'立项审批', next:'合同审核通过'},
 '立项驳回':   {label:'立项审批', next:'立项审核中'},
 '合同审核通过': {label:'交付审批', next:'执行中'},
 '执行中': {label:'交付审批', next:'交付完成'},
 '交付完成': {label:'已完成', next:null},
 '已关闭': {label:'已关闭', next:null},
};

function fmtAmt(n){
  if(n>=1000000){ const w=n/10000; return '¥'+w.toLocaleString('en-US')+'万'; }
  return '¥'+n.toLocaleString('en-US');
}

function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(window.__ttimer); window.__ttimer=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ============ 状态筛选：自定义瓦片下拉 ============ */
let activeStatus='全部状态', searchQ='', sortKey=null, sortDir=1, currentPage=1;

function buildStatusDD(){
  const wrap=document.createElement('div'); wrap.className='dd';
  const trig=document.createElement('button'); trig.type='button'; trig.className='dd-trig';
  const pop=document.createElement('div'); pop.className='dd-pop';
  const allOpts=['全部状态', ...STATUS_ORDER];
  function paint(){
    const dot = activeStatus==='全部状态' ? '' : `<span class="dd-dot" style="background:${STATUS_STYLE[activeStatus].fg}"></span>`;
    trig.innerHTML = dot + `<span>${activeStatus}</span><i class="cv"></i>`;
  }
  allOpts.forEach(s=>{
    const o=document.createElement('div'); o.className='dd-opt'+(s===activeStatus?' on':'');
    const dot = s==='全部状态' ? '<span class="dd-dot" style="background:#c9d6d4"></span>' : `<span class="dd-dot" style="background:${STATUS_STYLE[s].fg}"></span>`;
    o.innerHTML = dot + `<span>${s}</span>`;
    o.onclick=(e)=>{
      e.stopPropagation(); activeStatus=s; currentPage=1;
      pop.querySelectorAll('.dd-opt').forEach(x=>x.classList.remove('on')); o.classList.add('on');
      paint(); wrap.classList.remove('open'); renderTable();
    };
    pop.appendChild(o);
  });
  trig.onclick=(e)=>{ e.stopPropagation(); wrap.classList.toggle('open'); };
  paint();
  wrap.append(trig,pop);
  document.getElementById('statusDD').appendChild(wrap);
}
buildStatusDD();
document.addEventListener('click', ()=>document.querySelectorAll('.dd.open').forEach(d=>d.classList.remove('open')));

document.getElementById('searchInput').addEventListener('input', (e)=>{ searchQ=e.target.value.trim().toLowerCase(); currentPage=1; renderTable(); });
document.getElementById('resetBtn').onclick=()=>{
  activeStatus='全部状态'; searchQ=''; sortKey=null; sortDir=1; currentPage=1;
  document.getElementById('searchInput').value='';
  document.querySelectorAll('.dd-opt').forEach(x=>x.classList.remove('on'));
  document.querySelector('.dd-opt').classList.add('on');
  document.querySelector('.dd-trig').innerHTML = '<span>全部状态</span><i class="cv"></i>';
  renderThead(); renderTable(); toast('已重置筛选、搜索与排序');
};
document.getElementById('createBtn').onclick=()=>toast('「创建项目」为原型演示按钮，暂未接入真实创建流程');

/* ============ 表头 / 排序 ============ */
const COLS = [
 {k:'name', l:'项目名称', sortable:false},
 {k:'type', l:'项目类型', sortable:false},
 {k:'status', l:'项目状态', sortable:false},
 {k:'cust', l:'客户名称', sortable:false},
 {k:'owner', l:'负责人', sortable:false},
 {k:'need', l:'关联需求', sortable:false},
 {k:'contract', l:'合同金额', sortable:true, num:true},
 {k:'signDate', l:'签约日期', sortable:true},
 {k:'op', l:'操作', sortable:false, op:true},
];
const theadRow=document.getElementById('theadRow');
function renderThead(){
  theadRow.innerHTML = COLS.map(c=>{
    const sorted = sortKey===c.k;
    const arrow = sorted ? (sortDir===1?'▲':'▼') : (c.sortable?'↕':'');
    return `<th class="${c.num?'num ':''}${c.op?'opcol ':''}${c.sortable?'sortable':''}${sorted?' sorted':''}" data-k="${c.k}">${c.l}${c.sortable?`<span class="sarrow">${arrow}</span>`:''}</th>`;
  }).join('');
  theadRow.querySelectorAll('th.sortable').forEach(th=>{
    th.onclick=()=>{
      const k=th.dataset.k;
      if(sortKey===k){ sortDir*=-1; } else { sortKey=k; sortDir=1; }
      renderThead(); renderTable();
    };
  });
}
renderThead();

function getFiltered(){
  let rows = PROJECTS.filter(p=>{
    if(activeStatus!=='全部状态' && p.status!==activeStatus) return false;
    if(searchQ){
      const hay=(p.name+' '+p.cust+' '+p.owner).toLowerCase();
      if(!hay.includes(searchQ)) return false;
    }
    return true;
  });
  if(sortKey){
    rows = rows.slice().sort((a,b)=>{
      let av=a[sortKey], bv=b[sortKey];
      if(sortKey==='signDate'){ av=new Date(av).getTime(); bv=new Date(bv).getTime(); }
      return (av>bv?1:av<bv?-1:0)*sortDir;
    });
  }
  return rows;
}

/* ============ 操作图标（已换成新图形） ============ */
const ICON_DETAIL='<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V9z"/><path d="M14 3v6h6"/><path d="M9 13h6M9 17h4"/>';       // 文件/详情
const ICON_PROGRESS='<path d="M3 17l6-6 4 4 8-8"/><path d="M17 8h4v4"/>';                                                              // 趋势/进度

const PAGE_SIZE = 10;
const tbody=document.getElementById('tbody');
function renderTable(){
  const rows = getFiltered();
  const totalPages = Math.max(1, Math.ceil(rows.length/PAGE_SIZE));
  if(currentPage>totalPages) currentPage=totalPages;
  const pageRows = rows.slice((currentPage-1)*PAGE_SIZE, currentPage*PAGE_SIZE);

  tbody.innerHTML='';
  pageRows.forEach((p, idx)=>{
    const st = STATUS_STYLE[p.status];
    const typeHtml = p.type ? `<span class="typetag">${p.type}</span>` : `<span class="typetag na">—</span>`;
    const needHtml = p.need ? `<span class="needlink" data-need="${p.need}">${p.need}</span>` : `<span class="needna">—</span>`;
    const rule = APPROVAL_RULES[p.status];
    // 主操作按钮：只有存在下一阶段时才渲染，没有就自然留白，不放置灰态占位按钮
    const ctaHtml = rule.next
      ? `<button class="opcta" data-act="approve">${rule.label}</button>`
      : '';

    const d=new Date(p.signDate);
    const dateBadgeHtml = `<span class="datebadge">
        <span class="db-ym tnum">${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}</span>
        <span class="db-day tnum">${String(d.getDate()).padStart(2,'0')}</span>
      </span>`;

    const tr=document.createElement('tr'); tr.className='datarow'+(idx%2===1?' zebra':'');
    tr.innerHTML = `
      <td><span class="pname" data-act="detail">${p.name}</span></td>
      <td>${typeHtml}</td>
      <td><span class="stpill" style="background:${st.bg};color:${st.fg}"><span class="pd" style="background:${st.fg}"></span>${p.status}</span></td>
      <td>${p.cust}</td>
      <td><span class="ownercell"><span class="ownerav" style="background:${avatarGrad(p.owner)}">${p.owner.charAt(0).toUpperCase()}</span><span class="ownername">${p.owner}</span></span></td>
      <td>${needHtml}</td>
      <td class="num amt tnum">${fmtAmt(p.contract)}</td>
      <td>${dateBadgeHtml}</td>
      <td class="opcol">
        <div class="opgroup">
          <span class="opicon" data-act="detail"><span class="otip">查看详情</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON_DETAIL}</svg></span>
          <span class="opicon" data-act="progress"><span class="otip">了解项目进度</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">${ICON_PROGRESS}</svg></span>
          <span class="opdivider"></span>
          <button class="opsec" data-act="sched">实施安排</button>
          ${ctaHtml}
        </div>
      </td>`;

    tr.querySelectorAll('[data-act="detail"]').forEach(el=>el.onclick=()=>{
      toast(`${p.name} · ${p.cust} · 负责人 ${p.owner} · 合同金额 ${fmtAmt(p.contract)} · 签约 ${p.signDate.replaceAll('-','/')}`);
    });
    tr.querySelector('[data-act="progress"]').onclick=()=>{
      const effStage = p.status==='立项驳回' ? '立项审核中' : p.status;
      const idx2 = STAGE_ORDER.indexOf(effStage);
      const stepTxt = `第 ${idx2+1}/${STAGE_ORDER.length} 步`;
      const extra = p.status==='立项驳回' ? '（立项材料已被驳回，需重新提交）' : rule.next ? `，下一步「${rule.label}」` : '，流程已结束';
      toast(`「${p.name}」当前处于「${STAGE_LABEL[effStage]}」阶段 · ${stepTxt}${extra}`);
    };
    tr.querySelector('[data-act="sched"]').onclick=()=>{
      toast(`源数据未提供该项目的排期 / 任务分解字段，暂无实施安排记录 —— 已知签约日期为 ${p.signDate.replaceAll('-','/')}`);
    };
    const ctaBtn=tr.querySelector('[data-act="approve"]');
    if(ctaBtn) ctaBtn.onclick=()=>doApprove(p);
    const needEl=tr.querySelector('.needlink');
    if(needEl) needEl.onclick=()=>toast(`关联需求「${needEl.dataset.need}」详情（原型演示，暂未接入需求模块）`);

    tbody.appendChild(tr);
  });

  renderPager(totalPages, rows.length);
}

function renderPager(totalPages, filteredCount){
  const pager=document.getElementById('pager');
  pager.innerHTML='';
  const prev=document.createElement('button'); prev.className='pgbtn'; prev.textContent='‹';
  prev.disabled = currentPage<=1; prev.onclick=()=>{currentPage--;renderTable();};
  pager.appendChild(prev);
  for(let i=1;i<=Math.max(totalPages,1);i++){
    const b=document.createElement('button'); b.className='pgbtn'+(i===currentPage?' on':''); b.textContent=i;
    b.onclick=()=>{currentPage=i;renderTable();};
    pager.appendChild(b);
  }
  const next=document.createElement('button'); next.className='pgbtn'; next.textContent='›';
  next.disabled = currentPage>=totalPages; next.onclick=()=>{currentPage++;renderTable();};
  pager.appendChild(next);

  const note=document.getElementById('pageNote');
  if(filteredCount < TOTAL_PROJECTS && activeStatus==='全部状态' && !searchQ){
    note.textContent = `源列表共 ${TOTAL_PROJECTS} 条 · 2 页，此处呈现原图可读取的第 1 页（${filteredCount} 条）`;
  } else {
    note.textContent = `当前筛选结果 ${filteredCount} 条`;
  }
}

/* ============ 审批动作（本地原型演示，不写入真实后端） ============ */
function doApprove(p){
  const rule = APPROVAL_RULES[p.status];
  if(!rule.next) return;
  const from=p.status, to=rule.next;
  p.status = to;
  renderTable();
  toast(`已提交「${rule.label}」：项目状态由「${from}」更新为「${to}」 —— 原型演示，仅本地生效，不会写入实际系统`);
}

renderTable();
</script>
</body>
