<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>项目管理 | FansAI 数据中台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1b2430;--ink2:#0f3132;--muted:#64748b;--muted2:#94a3b8;--line:#e2ecea;
  --teal:#008aa8;--teal2:#0c7074;--mint:#12b89d;--blue:#2563eb;--ok:#1a9e4b;
  --warn:#d68e20;--err:#df5f4f;--white:rgba(255,255,255,.78);
  --cn:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --en:"Outfit","Noto Sans SC",sans-serif;
  --shadow:0 24px 60px -34px rgba(17,65,63,.34),inset 0 1px 0 rgba(255,255,255,.78)
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{min-height:100vh;color:var(--ink);font-family:var(--cn);font-weight:500;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1000px 620px at 8% -8%,rgba(154,220,203,.42),transparent 61%),
    radial-gradient(880px 560px at 92% 1%,rgba(73,182,216,.28),transparent 60%),
    radial-gradient(760px 520px at 54% 108%,rgba(0,138,168,.10),transparent 62%),
    #edf5f3;background-attachment:fixed}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.tnum{font-family:var(--en);font-variant-numeric:tabular-nums}
.wrap{max-width:1680px;margin:0 auto;padding:26px 36px 60px}
.glass{background:linear-gradient(155deg,rgba(255,255,255,.80),rgba(255,255,255,.55));border:1px solid rgba(255,255,255,.84);box-shadow:var(--shadow);backdrop-filter:blur(24px) saturate(155%);-webkit-backdrop-filter:blur(24px) saturate(155%)}
.glass-lite{background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.72);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.reveal{animation:rise .48s cubic-bezier(.2,.7,.2,1) both}

/* complete system header — aligned to execution dashboard */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.bcrumb{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:20px;background:#fff;border:2px solid #f5fffe;box-shadow:0 6px 18px -10px rgba(15,49,50,.18)}
.bdot{width:12px;height:12px;flex:0 0 auto;border-radius:50%;background:linear-gradient(140deg,#9adccb,#49b6d8)}
.bmain,.bsub{font-family:var(--en);font-size:18px;letter-spacing:1.08px;line-height:24px}.bmain{font-weight:700}.bsub{font-weight:300}
.tb-right{display:flex;align-items:center;gap:12px}.bellbtn{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;border:2px solid #f5fffe;background:#fff;color:var(--ink);box-shadow:0 6px 18px -10px rgba(15,49,50,.18);transition:.18s}.bellbtn:hover{transform:translateY(-1px)}.bellbtn svg{width:19px;height:19px}
.me{display:flex;align-items:center;gap:8px;border:0;background:transparent}.avatar{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;border:2px solid #f5fffe;background:linear-gradient(140deg,#b5e9c2,#58bdd7);color:#04312f;font-family:var(--en);font-size:16px;font-weight:700}.mename{font-family:var(--en);font-size:18px;font-weight:500}.me>svg{width:14px;height:14px;color:var(--muted2)}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}.tabs{display:flex;align-items:center;gap:6px;width:fit-content;padding:6px;border-radius:18px}.tab{display:flex;align-items:baseline;gap:7px;padding:9px 18px;border:0;border-radius:13px;background:transparent;color:var(--muted);font-size:14px;font-weight:500;white-space:nowrap;transition:.18s}.tab .ten{font-family:var(--en);font-size:9.5px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted2)}.tab.on{background:var(--ink);color:#fff;font-weight:600;box-shadow:0 10px 22px -10px rgba(15,49,50,.4)}.tab.on .ten{color:rgba(255,255,255,.62)}.tab:not(.on):hover{color:var(--ink);background:rgba(255,255,255,.6)}
.ctrlrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.datepill{display:flex;align-items:baseline;gap:7px;padding:9px 15px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.6);color:var(--muted);font-size:12.5px}.datepill b{font-family:var(--en);font-size:13px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}.headerghost{display:flex;align-items:center;gap:7px;padding:9px 15px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.6);color:var(--muted);font-size:12.5px;font-weight:600;transition:.16s}.headerghost svg{width:14px;height:14px}.headerghost:hover{color:var(--ink);border-color:#cfe0e0;background:#fff}.refreshbtn{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.6);color:var(--muted);transition:.2s}.refreshbtn:hover{color:var(--ink);border-color:#cfe0e0;background:#fff}.refreshbtn svg{width:16px;height:16px}.refreshbtn.spin svg{animation:spin .7s linear}@keyframes spin{to{transform:rotate(360deg)}}

/* primary action */
.primary,.ghost,.exportbtn{height:44px;border-radius:14px;font-size:12.5px;font-weight:700;border:1px solid var(--line);transition:.18s}
.primary{display:flex;align-items:center;gap:8px;padding:0 18px;border-color:var(--ink2);background:var(--ink2);color:#fff;box-shadow:0 14px 28px -15px rgba(15,49,50,.62)}
.primary:hover{transform:translateY(-1px);background:#123d3a}.primary svg{width:15px;height:15px}

/* KPI overview — 纯 CSS 玻璃卡（V2.1 token），不依赖任何外部 SVG 底图 */
.overview{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;margin-bottom:28px}
.kpi{position:relative;isolation:isolate;min-width:0;min-height:166px;display:flex;flex-direction:column;padding:19px 21px 17px;border:1px solid rgba(255,255,255,.78);border-radius:24px;text-align:left;overflow:hidden;
  background:linear-gradient(160deg,rgba(255,255,255,.80),rgba(255,255,255,.54));
  backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
  box-shadow:0 24px 54px -28px rgba(20,60,60,.26),inset 0 1px 0 rgba(255,255,255,.65);
  transition:transform .18s,box-shadow .18s,border-color .18s}
.kpi::before{content:"";position:absolute;z-index:-1;inset:0;border-radius:inherit;opacity:.45;transition:opacity .2s;
  background:radial-gradient(126% 92% at 100% 0,color-mix(in srgb,var(--kc) 16%,transparent),transparent 64%)}
.kpi::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;opacity:0;transition:opacity .2s;
  background:linear-gradient(90deg,var(--kc),color-mix(in srgb,var(--kc) 26%,#ffffff))}
.kpi:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.95);box-shadow:0 30px 62px -30px rgba(20,60,60,.33),inset 0 1px 0 rgba(255,255,255,.82)}
.kpi.on{border-color:color-mix(in srgb,var(--kc) 32%,rgba(255,255,255,.9));box-shadow:0 26px 56px -28px color-mix(in srgb,var(--kc) 46%,transparent),inset 0 1px 0 rgba(255,255,255,.82)}
.kpi.on::before{opacity:1}.kpi.on::after{opacity:1}
.kpi:focus-visible{outline:0;box-shadow:0 0 0 4px rgba(73,182,216,.22)}
.khead{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.kname{display:flex;align-items:center;gap:7px;min-width:0;font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kname::before{content:"";width:7px;height:7px;flex:0 0 auto;border-radius:50%;background:var(--kc);box-shadow:0 0 0 3px color-mix(in srgb,var(--kc) 15%,transparent)}
.ken{flex:0 0 auto;font-family:var(--en);font-size:9px;font-weight:600;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted2)}
.kn{display:flex;align-items:baseline;gap:5px;margin:13px 0 6px}
.knum{font-family:var(--en);font-size:38px;font-weight:700;line-height:1;letter-spacing:-.6px;color:var(--ink);font-variant-numeric:tabular-nums}
.kunit{font-size:14px;font-weight:500;color:var(--muted)}
.kcap{font-size:11.5px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kviz{margin-top:auto;padding-top:15px}
.ksegbar{display:flex;gap:3px;height:9px}
.ksegbar i{min-width:4px;border-radius:6px;background:var(--sc,color-mix(in srgb,var(--kc) var(--m,100%),#eef4f2))}
.ksegbar i.lead{box-shadow:0 6px 12px -8px color-mix(in srgb,var(--kc) 85%,transparent)}
.klegend{display:flex;flex-wrap:wrap;gap:3px 11px;margin-top:9px;line-height:1.55}
.klegend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:10.5px;color:var(--muted2)}
.klegend i{width:6px;height:6px;flex:0 0 auto;border-radius:2px;background:var(--sc,color-mix(in srgb,var(--kc) var(--m,100%),#eef4f2))}
.klegend b{font-family:var(--en);font-size:11px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}

/* milestone panels — aligned to the confirmed execution dashboard component */
.milestones{margin-bottom:18px}
.milestonehead{display:flex;align-items:baseline;gap:9px;margin:0 0 16px 2px}.milestonehead h2{font-size:18px;font-weight:700;color:var(--ink)}.milestonehead span{font-family:var(--en);font-size:10px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted2)}
.milestonegrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:stretch}
.weekcard{min-height:328px;border-radius:20px;padding:19px 20px;display:flex;flex-direction:column;min-width:0;background:rgba(255,255,255,.55);border:1px solid var(--line)}
.weekhead{display:flex;align-items:baseline;gap:9px;margin-bottom:8px}
.weektitle{display:flex;align-items:baseline;gap:9px;min-width:0}.weektitle h2{font-size:14px;color:var(--ink2);font-weight:600}.weektitle span{font-family:var(--en);font-size:11px;color:var(--muted2);white-space:nowrap}
.nodes{flex:1;min-height:0;padding-right:2px}
.nodeitem{position:relative;display:grid;grid-template-columns:22px minmax(0,1fr) auto;grid-template-rows:auto auto;align-items:center;gap:2px 9px;padding:13px 4px 14px 0;border-radius:10px;transition:.16s}
.nodeitem:hover{background:rgba(255,255,255,.65)}
.nodeitem:not(:last-child)::after{content:"";position:absolute;left:10px;top:32px;bottom:-8px;width:1px;background:var(--line)}
.nodedot{width:11px;height:11px;grid-row:1/span 2;justify-self:center;position:relative;z-index:1;border-radius:50%;background:#fff;border:2px solid var(--teal)}
.nodeitem.late .nodedot{background:var(--err);border-color:var(--err)}
.nodeitem.warn .nodedot{background:#fff;border-color:var(--warn)}
.nodetitle{min-width:0;display:flex;align-items:baseline;gap:8px;line-height:1.5}.nodetitle b{font-size:12.5px;font-weight:600;color:var(--ink2);flex:0 0 auto}.nodeitem.late .nodetitle b{color:var(--err)}.nodetitle span{font-size:11.5px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nodesub{grid-column:2;font-size:10.5px;color:var(--muted2)}
.nodedue{grid-column:3;grid-row:1/span 2;align-self:center;font-family:var(--en);font-size:11px;font-weight:500;color:var(--muted);white-space:nowrap}.nodeitem.late .nodedue{color:var(--err);font-weight:600}.nodeitem.warn .nodedue{color:var(--warn);font-weight:600}
.emptyweek{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted2)}
.emptyicon{width:48px;height:48px;display:grid;place-items:center;border-radius:17px;background:rgba(0,138,168,.07);color:var(--teal2);margin-bottom:11px}.emptyicon svg{width:22px;height:22px}
.emptyweek strong{font-size:12.5px;color:var(--muted)}.emptyweek span{font-size:11px;margin-top:5px}

/* filters */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;position:relative;z-index:12}
.search{height:46px;min-width:300px;flex:1;display:flex;align-items:center;gap:10px;padding:0 15px;border-radius:14px;background:rgba(255,255,255,.68);border:1px solid var(--line);transition:.18s}
.search:focus-within{background:#fff;border-color:#49b6d8;box-shadow:0 0 0 4px rgba(73,182,216,.14)}
.search svg{width:16px;height:16px;color:var(--muted2)}.search input{width:100%;border:0;outline:0;background:transparent;font-size:12.5px}.search input::placeholder{color:var(--muted2)}
.dd{position:relative;flex:0 0 auto}.dd-trig,.exportbtn{height:46px;display:flex;align-items:center;gap:9px;padding:0 14px;border-radius:14px;background:rgba(255,255,255,.68);border:1px solid var(--line);font-size:12px;font-weight:650;white-space:nowrap}
.dd-trig{min-width:126px}.dd.open .dd-trig{background:#fff;border-color:#49b6d8;box-shadow:0 0 0 4px rgba(73,182,216,.14)}
.cv{width:7px;height:7px;margin-left:auto;border-right:1.8px solid var(--muted2);border-bottom:1.8px solid var(--muted2);transform:rotate(45deg);transition:.18s}.dd.open .cv{transform:rotate(225deg);margin-top:4px}
.dd-pop{display:none;position:absolute;top:calc(100% + 8px);left:0;z-index:44;min-width:190px;padding:8px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.98);box-shadow:0 22px 54px -24px rgba(15,49,50,.42)}
.dd.open .dd-pop{display:block;animation:rise .16s ease both}.dd-opt{display:flex;align-items:center;gap:8px;width:100%;padding:9px 11px;border:0;border-radius:10px;background:transparent;text-align:left;font-size:12px;color:var(--muted)}
.dd-opt:hover{background:#f0f7f5;color:var(--ink2)}.dd-opt.on{background:#e8f4f1;color:var(--teal2);font-weight:700}.dd-opt i{width:7px;height:7px;border-radius:50%;background:var(--oc,#94a3b8)}
.exportbtn{margin-left:auto;min-width:auto}.exportbtn:hover{background:#fff;color:var(--teal2);border-color:#c9deda}.exportbtn svg{width:15px;height:15px}

/* project board */
.board{border-radius:24px;overflow:hidden}
.tablewrap{overflow:auto;scrollbar-width:thin;scrollbar-color:#c8dbd8 transparent}
.project-head,.project-row{display:grid;grid-template-columns:minmax(310px,1.7fr) 126px 176px minmax(254px,1.3fr) 118px 160px 58px;min-width:1320px;align-items:center;padding:0 18px}
.project-head{--row-bg:#f5faf9;height:58px;color:var(--muted2);font-size:11px;font-weight:700;letter-spacing:.25px;border-bottom:1px solid var(--line);background:var(--row-bg)}
.project-head span:last-child{text-align:center;position:sticky;right:0;z-index:3;background:var(--row-bg);height:58px;display:grid;place-items:center;border-left:1px solid transparent}
.project-row{--row-bg:#f9fcfb;min-height:105px;border-bottom:1px solid rgba(226,236,234,.86);transition:.16s;background:var(--row-bg)}
.project-row:nth-child(odd){--row-bg:#fff}.project-row:hover{--row-bg:#f1f8f6}
.project-row.overdue{box-shadow:inset 3px 0 0 var(--err)}
.project-main{min-width:0;padding-right:22px}.project-name{font-size:13.5px;font-weight:700;color:var(--ink2);line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.project-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:10.5px;color:var(--muted2)}
.external{color:var(--blue);font-weight:700}.team{display:flex;align-items:center;gap:7px}.ownerav{width:29px;height:29px;display:grid;place-items:center;border-radius:50%;color:#fff;font-family:var(--en);font-size:9px;font-weight:800;border:2px solid rgba(255,255,255,.88);box-shadow:0 6px 14px -9px rgba(15,49,50,.62)}
.teamsplit{color:#b7c6c4}.money strong{display:block;font-family:var(--en);font-size:14px;color:var(--ink2);font-weight:700;font-variant-numeric:tabular-nums}.money small{display:block;margin-top:5px;font-size:10.5px;color:var(--muted2);line-height:1.5}.estimate{display:inline-block;margin-left:4px;padding:2px 5px;border:1px solid #dbe7e5;border-radius:6px;font-size:9px;color:var(--muted2);vertical-align:2px}
.progress{padding-right:20px}.progressbar{display:flex;gap:4px;margin-bottom:8px}.progressbar i{width:18px;height:4px;border-radius:99px;background:#dfe9e7}.progressbar i.on{background:var(--pc,#12b89d)}
.progressline{font-size:11.5px;color:var(--ink2);font-weight:600}.progressline em{font-style:normal;color:var(--muted2);font-weight:500}.nextnode{display:block;margin-top:6px;font-size:10.5px;color:var(--muted2)}.nextnode.warn{color:var(--err);font-weight:700}.nextnode::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;background:currentColor;vertical-align:1px}
.fund{display:inline-flex;align-items:center;width:max-content;padding:5px 10px;border-radius:12px;font-size:10.5px;font-weight:700}.fund.unpaid{color:#c65b48;background:#fcebe7}.fund.paid{color:#0d8872;background:#e3f6ef}
.period{font-family:var(--en);font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}.period small{display:block;margin-top:5px;font-family:var(--cn);font-size:10.5px;color:var(--muted2)}
.actioncell{position:sticky;right:0;align-self:stretch;display:grid;place-items:center;background:var(--row-bg);border-left:1px solid transparent;z-index:2;transition:background .16s,border-color .16s}
.tablewrap.is-scrolled .actioncell,.tablewrap.is-scrolled .project-head span:last-child{border-left-color:rgba(210,226,223,.82)}
.more{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.72);color:var(--muted);transition:.16s}.more:hover,.more.on{background:#fff;color:var(--teal2);border-color:rgba(0,138,168,.34);transform:translateY(-1px);box-shadow:0 10px 20px -13px rgba(0,138,168,.5)}
.more svg{width:16px;height:16px}.boardfoot{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 20px;color:var(--muted2);font-size:10.5px}.boardfoot b{font-family:var(--en);color:var(--muted)}
.pager{display:flex;gap:6px}.pagebtn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.65);font-family:var(--en);font-size:11px;color:var(--muted)}.pagebtn.on{background:var(--ink2);color:#fff;border-color:var(--ink2)}

/* contextual menu */
.rowmenu{display:none;position:fixed;z-index:70;width:260px;padding:9px;border:1px solid rgba(219,232,230,.95);border-radius:18px;background:rgba(255,255,255,.98);box-shadow:0 26px 70px -24px rgba(7,42,40,.48);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.rowmenu.show{display:block;animation:menuIn .17s ease both}@keyframes menuIn{from{opacity:0;transform:translateY(-4px) scale(.985)}to{opacity:1;transform:none}}
.rowmenulabel{padding:8px 10px 5px;font-family:var(--en);font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#a2b4b1}
.rowmenuitem{width:100%;display:grid;grid-template-columns:32px 1fr auto;align-items:center;gap:10px;min-height:50px;padding:0 10px;border:0;border-radius:11px;background:transparent;text-align:left;color:var(--ink2)}
.rowmenuitem:hover{background:#f1f8f6}.rowmenuicon{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.7);color:var(--muted);transition:transform .16s,border-color .16s,background .16s,color .16s,box-shadow .16s}.rowmenuicon svg{width:16px;height:16px;display:block;overflow:visible}.rowmenuitem:hover .rowmenuicon{transform:translateY(-1px);border-color:rgba(0,138,168,.35);background:#fff;color:var(--teal2);box-shadow:0 10px 20px -12px rgba(0,138,168,.4)}
.rowmenuitem strong{font-size:11.5px;font-weight:700}.rowmenuitem small{font-size:9.5px;color:var(--muted2);white-space:nowrap}.rowmenudivider{height:1px;background:var(--line);margin:6px 5px}.rowmenuitem.danger{color:#d9544f}.rowmenuitem.danger .rowmenuicon{border-color:#f4d6d2;background:#fff8f6;color:#e37a70}.rowmenuitem.danger:hover{background:#fff2f0}.rowmenuitem.danger:hover .rowmenuicon{border-color:#eca8a0;background:#fff;color:#d9544f;box-shadow:0 10px 20px -12px rgba(217,84,79,.42)}

/* modal */
.scrim{display:none;position:fixed;inset:0;z-index:80;padding:24px;align-items:center;justify-content:center;background:rgba(31,71,69,.34);backdrop-filter:blur(12px) saturate(115%)}
.scrim.show{display:flex;animation:fade .18s ease both}@keyframes fade{from{opacity:0}to{opacity:1}}

 items.forEach((it,i)=>{const btn=document.createElement('button');btn.type='button';btn.className='dd-opt';btn.dataset.value=it;btn.innerHTML=`<i style="--oc:${['#94a3b8','#12b89d','#d68e20','#2563eb'][i%4]}"></i><span>${esc(it)}</span>`;btn.onclick=e=>{e.stopPropagation();state[key]=it;paint();wrap.classList.remove('open');render()};pop.appendChild(btn)});
 trig.onclick=e=>{e.stopPropagation();const next=!wrap.classList.contains('open');document.querySelectorAll('.dd.open').forEach(x=>x.classList.remove('open'));wrap.classList.toggle('open',next)};
 wrap.append(trig,pop);mount.appendChild(wrap);paint();
}

function filtered(){
 return PROJECTS.filter(p=>{
  if(state.scope==='mine'&&!p.mine)return false;
  if(state.kpi==='active'&&!p.active)return false;
  if(state.kpi==='overdue'&&!p.overdue)return false;
  if(state.kpi==='delivery'&&!p.delivery)return false;
  if(state.stage!=='全部阶段'&&p.stage!==state.stage)return false;
  if(state.type==='含外部团队'&&!p.external)return false;
  if(state.type==='内部团队'&&p.external)return false;
  if(state.progress==='进行中'&&!p.active)return false;
  if(state.progress==='成片已出'&&p.progress!=='成片已出')return false;
  if(state.progress==='未开始'&&p.stage!=='未开始')return false;
  if(state.owner==='我负责的'&&!p.mine)return false;
  if(state.owner==='其他负责人'&&p.mine)return false;
  const q=state.search.toLowerCase();return !q||`${p.name} ${p.meta}`.toLowerCase().includes(q);
 });
}

function render(){
 const rows=filtered();
 document.querySelectorAll('.kpi').forEach(k=>{const on=k.dataset.kpi===state.kpi;k.classList.toggle('on',on);k.setAttribute('aria-pressed',String(on))});
 document.querySelectorAll('[data-scope]').forEach(b=>{const on=b.dataset.scope===state.scope;b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on))});
 const host=document.getElementById('projectRows');
 if(!rows.length){host.innerHTML='<div style="min-width:1320px;padding:74px 24px;text-align:center;color:#94a3b8;font-size:12px">没有符合当前条件的项目</div>'}
 else host.innerHTML=rows.map(p=>{
  const steps=Array.from({length:6},(_,i)=>`<i class="${i<(p.step||0)?'on':''}"></i>`).join('');
  const next=p.next?`<span class="nextnode ${p.overdue?'warn':''}">${esc(p.next)}${p.overdue?`　逾期 ${p.overdue} 天`:''}</span>`:'';
  return `<article class="project-row ${p.overdue?'overdue':''}" data-id="${p.id}">
   <div class="project-main"><div class="project-name" title="${esc(p.name)}">${esc(p.name)}</div><div class="project-meta"><span>${esc(p.meta)}</span>${p.external?'<span>·</span><span class="external">含外部团队</span>':''}</div></div>
   <div class="team">${avatar('BD',p.id)}<span class="teamsplit">|</span>${avatar('AE',p.id+2)}</div>
   <div class="money"><strong>${money(p.amount)}${p.estimate?'<span class="estimate">预估</span>':''}</strong><small>${p.margin!=null?`毛利 ${money(p.margin)}　·　${p.profit}%`:'毛利 待定　·　合同未签'}</small></div>
   <div class="progress"><div class="progressbar" style="--pc:${p.pc}">${steps}</div><div class="progressline">${esc(p.stage)}${p.progress&&p.progress!==p.stage?`　·　<em>${esc(p.progress)}</em>`:''}</div>${next}</div>
   <div><span class="fund ${p.fund==='已回款'?'paid':'unpaid'}">${esc(p.fund)}</span></div>
   <div class="period">${esc(p.start)}${p.end?` → ${esc(p.end)}`:' 起'}<small>${esc(p.days)}</small></div>
   <div class="actioncell"><button class="more" data-more="${p.id}" aria-label="更多操作"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button></div>
  </article>`}).join('');
 document.getElementById('resultNote').innerHTML=`当前显示 <b>${rows.length}</b> / ${PROJECTS.length} 个项目`;
 host.querySelectorAll('[data-more]').forEach(btn=>btn.onclick=e=>openRowMenu(e.currentTarget,Number(e.currentTarget.dataset.more)));
}

const rowMenu=document.getElementById('rowMenu');let activeProject=null;
function closeRowMenu(){rowMenu.classList.remove('show');rowMenu.setAttribute('aria-hidden','true');document.querySelectorAll('.more.on').forEach(x=>x.classList.remove('on'))}
const ROW_MENU_ICONS={
 progress:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M42 8V24"/><path d="M6 24V40"/><path d="M42 24C42 14.06 33.94 6 24 6C18.91 6 14.32 8.11 11.05 11.5M6 24C6 33.94 14.06 42 24 42C28.86 42 33.26 40.08 36.5 36.95"/></svg>',
 need:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8C5 6.9 5.9 6 7 6H19L24 12H41C42.1 12 43 12.9 43 14V40C43 41.1 42.1 42 41 42H7C5.9 42 5 41.1 5 40V8Z"/><path d="M18 27H30M24 21V33"/></svg>',
 brief:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M44 4L22 26"/><path d="M44 4L30 44L22 26L4 18L44 4Z"/></svg>',
 edit:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M29 4H9C7.9 4 7 4.9 7 6V42C7 43.1 7.9 44 9 44H37C38.1 44 39 43.1 39 42V20"/><path d="M13 18H21M13 28H25M41 6L29 18"/></svg>',
 close:'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="24" cy="24" r="20"/><path d="M17 17L31 31M31 17L17 31"/></svg>'
};
function rowMenuIcon(name){return `<span class="rowmenuicon">${ROW_MENU_ICONS[name]}</span>`}
function openRowMenu(btn,id){
 const p=PROJECTS.find(x=>x.id===id);activeProject=p;const already=rowMenu.classList.contains('show')&&btn.classList.contains('on');closeRowMenu();if(already)return;
 rowMenu.innerHTML=`<div class="rowmenulabel">当前</div><button class="rowmenuitem" data-command="progress">${rowMenuIcon('progress')}<strong>更新制作进度</strong><small>走到哪了</small></button><div class="rowmenulabel">接下来</div><button class="rowmenuitem" data-command="need">${rowMenuIcon('need')}<strong>新增需求对接</strong><small>补充需求</small></button><button class="rowmenuitem" data-command="brief">${rowMenuIcon('brief')}<strong>派发 Brief</strong><small>发给执行人</small></button><div class="rowmenudivider"></div><button class="rowmenuitem" data-command="edit">${rowMenuIcon('edit')}<strong>编辑项目信息</strong><small></small></button><div class="rowmenudivider"></div><button class="rowmenuitem danger" data-command="close">${rowMenuIcon('close')}<strong>关闭项目</strong><small></small></button>`;
 rowMenu.querySelectorAll('[data-command]').forEach(x=>x.onclick=()=>handleCommand(x.dataset.command));
 const r=btn.getBoundingClientRect();rowMenu.classList.add('show');rowMenu.setAttribute('aria-hidden','false');btn.classList.add('on');
 const menuH=rowMenu.offsetHeight,menuW=rowMenu.offsetWidth;const top=r.bottom+8+menuH>innerHeight?Math.max(10,r.top-menuH-8):r.bottom+8;const left=Math.min(innerWidth-menuW-10,Math.max(10,r.right-menuW));rowMenu.style.top=top+'px';rowMenu.style.left=left+'px';
}

const scrim=document.getElementById('scrim'),modal=document.getElementById('modal'),modalContent=document.getElementById('modalContent');
function dialog({title,subtitle='',body='',primary='保存',compact=false,action='save'}){
 closeRowMenu();modal.className='modal'+(compact?' compact':'');modalContent.innerHTML=`<header class="mhead"><div><h2 id="modalTitle">${esc(title)}</h2>${subtitle?`<p>${esc(subtitle)}</p>`:''}</div><button class="xbtn" data-close aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header><div class="mbody">${body}</div><footer class="mfoot"><button class="cancel" data-close>取消</button><button class="save" data-action="${action}">${esc(primary)}</button></footer>`;
 scrim.classList.add('show');scrim.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';initSelects();modalContent.querySelectorAll('[data-close]').forEach(x=>x.onclick=closeDialog);modalContent.querySelector('[data-action]').onclick=submitDialog;
}
function closeDialog(){scrim.classList.remove('show');scrim.setAttribute('aria-hidden','true');document.body.style.overflow=''}
function selectMarkup(id,label,value,opts,required=false){return `<div class="field"><label class="label">${label}${required?'<span class="req">必填</span>':''}</label><div class="selectcontrol" data-select="${id}" data-value="${esc(value)}"><button class="selecttrig" type="button"><span>${esc(value)}</span><i class="cv"></i></button><div class="selectoptions">${opts.map(x=>`<button class="selectoption ${x===value?'on':''}" type="button" data-value="${esc(x)}">${esc(x)}</button>`).join('')}</div></div><span class="errmsg">请选择${label}</span></div>`}
function fieldMarkup(id,label,placeholder='',value='',required=false,type='text'){return `<div class="field ${id==='projectName'?'full':''}"><label class="label">${label}${required?'<span class="req">必填</span>':''}</label><input class="input" id="${id}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}"><span class="errmsg">请填写${label}</span></div>`}
function initSelects(){modalContent.querySelectorAll('.selectcontrol').forEach(w=>{const trig=w.querySelector('.selecttrig');trig.onclick=e=>{e.stopPropagation();const next=!w.classList.contains('open');modalContent.querySelectorAll('.selectcontrol.open').forEach(x=>x.classList.remove('open'));w.classList.toggle('open',next)};w.querySelectorAll('.selectoption').forEach(o=>o.onclick=e=>{e.stopPropagation();w.dataset.value=o.dataset.value;trig.querySelector('span').textContent=o.dataset.value;w.querySelectorAll('.selectoption').forEach(x=>x.classList.toggle('on',x===o));w.classList.remove('open','err');w.parentElement.querySelector('.errmsg')?.classList.remove('show')})})}
function openProjectModal(p=null){
 const body=`<div class="grid2">${fieldMarkup('projectName','项目名称','例如：0806 名创优品 x 三丽鸥 联名短片',p?.name||'',true)}${selectMarkup('projectType','项目制作类型','AIGC 内容制作',['AIGC 内容制作','传统内容制作','整合营销','内部项目'],true)}${selectMarkup('customer','客户',p?p.name.split(' · ')[0]:'请选择客户',['请选择客户','恒瑞医药','名创优品','依云','Nike','内部项目'],true)}${fieldMarkup('contract','合同金额（元）','未签合同就填写预估',p?.amount||'',false,'number')}${selectMarkup('amountType','金额性质',p?.estimate?'预估（合同未签）':'合同金额',['合同金额','预估（合同未签）'])}${fieldMarkup('startDate','开始时间','',p?`2026-${p.start}`:'2026-08-21',false,'date')}${fieldMarkup('endDate','计划结束时间','',p?.end?`2026-${p.end}`:'',false,'date')}${selectMarkup('bd','BD','选择 BD',['选择 BD','由我负责','其他负责人'])}${selectMarkup('ae','AE','默认由我负责',['默认由我负责','其他负责人'])}</div>`;
 dialog({title:p?'编辑项目':'新建项目',subtitle:p?'修改项目的基础信息与执行周期。':'直接建立项目，适用于内部项目、临时追加或先开工后补合同。',body,primary:p?'保存修改':'创建项目',action:p?'edit-project':'create-project'});
}
function handleCommand(cmd){
 if(cmd==='edit')return openProjectModal(activeProject);
 if(cmd==='close')return dialog({title:'关闭项目',subtitle:activeProject.name,body:`<p class="confirmcopy">确认关闭 <strong>${esc(activeProject.name)}</strong>？关闭后将从“进行中”统计中移除。</p>`,primary:'确认关闭',compact:true,action:'close-project'});
 if(cmd==='progress')return dialog({title:'更新制作进度',subtitle:activeProject.name,body:selectMarkup('newProgress','制作进度',activeProject.progress,['未开始','故事创意 进行中','文字脚本 进行中','成片已出'],true),primary:'保存进度',compact:true,action:'update-progress'});
 if(cmd==='need')return dialog({title:'新增需求对接',subtitle:activeProject.name,body:fieldMarkup('needText','需求内容','填写需要对接的新需求','',true),primary:'保存需求',compact:true,action:'add-need'});
 if(cmd==='brief')return dialog({title:'派发 Brief',subtitle:activeProject.name,body:selectMarkup('briefOwner','接收人','请选择接收人',['请选择接收人','项目 AE','外部团队','创意负责人'],true),primary:'确认派发',compact:true,action:'send-brief'});
}
function invalidInput(id){const el=document.getElementById(id);if(!el||String(el.value).trim())return false;el.classList.add('err');el.parentElement.querySelector('.errmsg')?.classList.add('show');el.focus();return true}
function invalidSelect(id){const el=modalContent.querySelector(`[data-select="${id}"]`);if(!el||!['请选择客户','选择 BD','请选择接收人'].includes(el.dataset.value))return false;el.classList.add('err');el.parentElement.querySelector('.errmsg')?.classList.add('show');return true}
function submitDialog(e){
 const action=e.currentTarget.dataset.action;
 if(action==='create-project'||action==='edit-project'){
  const bad=invalidInput('projectName')|invalidSelect('customer');if(bad)return;
  if(action==='create-project'){PROJECTS.unshift({id:Date.now(),name:document.getElementById('projectName').value.trim(),meta:'2026 Q3 · '+modalContent.querySelector('[data-select="projectType"]').dataset.value,amount:Number(document.getElementById('contract').value)||null,stage:'未开始',progress:'待立项通过',next:null,overdue:0,fund:'未开票',start:'08-21',end:null,days:'进行中',active:false,delivery:false,mine:true,pc:'#dfe9e7'});toast('项目已添加到当前页面预览，不会写入业务系统。')}
  else{activeProject.name=document.getElementById('projectName').value.trim();activeProject.amount=Number(document.getElementById('contract').value)||null;toast('项目资料已在当前页面更新，不会写入业务系统。')}
 }
 if(action==='close-project'){activeProject.active=false;activeProject.closed=true;toast('项目已在当前页面标记为关闭，不会写入业务系统。')}
 if(action==='update-progress'){const v=modalContent.querySelector('[data-select="newProgress"]').dataset.value;activeProject.progress=v;activeProject.stage=v.includes('成片')?'成片已出':v.includes('未开始')?'未开始':'Idea 阶段';activeProject.active=!v.includes('未开始');toast(`制作进度已更新为“${v}”，仅在当前页面生效。`)}
 if(action==='add-need'){if(invalidInput('needText'))return;toast('需求已记录在当前页面预览，不会写入业务系统。')}
 if(action==='send-brief'){if(invalidSelect('briefOwner'))return;toast('Brief 已在当前页面标记为已派发，不会发送真实消息。')}
 closeDialog();updateStats();render();
}

const NEUTRAL='#D9E3E0';
function segbar(host,segs){
 const el=document.getElementById(host);if(!el)return;
 const list=segs.filter(s=>s.n>0);
 const total=list.reduce((a,s)=>a+s.n,0)||1;
 el.innerHTML=`<span class="ksegbar">${list.map((s,i)=>`<i class="${i===0?'lead':''}" style="flex:${s.n};${s.sc?`--sc:${s.sc}`:`--m:${s.m}%`}"></i>`).join('')}</span>`
  +`<span class="klegend">${list.map(s=>`<span><i style="${s.sc?`--sc:${s.sc}`:`--m:${s.m}%`}"></i>${s.k} <b>${s.n}</b></span>`).join('')}</span>`;
 el.dataset.total=total;
}
function renderKpiViz(){
 const g=f=>PROJECTS.filter(f).length,T=PROJECTS.length;
 const active=g(p=>p.active),overdue=g(p=>p.overdue),delivery=g(p=>p.delivery),closed=g(p=>p.closed);
 const extActive=g(p=>p.active&&p.external);
 segbar('vAll',[
  {k:'待立项',n:g(p=>p.progress==='待立项通过'),m:100},
  {k:'未开始',n:g(p=>p.progress==='未开始'),m:62},
  {k:'制作中',n:g(p=>/进行中/.test(p.progress)),m:42},
  {k:'成片',n:g(p=>p.progress==='成片已出'),m:26}]);
 segbar('vActive',[
  {k:'含外部',n:extActive,m:100},
  {k:'纯内部',n:active-extActive,m:44}]);
 segbar('vOverdue',[
  {k:'逾期',n:overdue,m:100},
  {k:'按期',n:T-overdue,sc:NEUTRAL}]);
 segbar('vDelivery',[
  {k:'待确认',n:delivery,m:100},
  {k:'其余',n:T-delivery,sc:NEUTRAL}]);
 segbar('vQuarter',[
  {k:'已签',n:g(p=>p.amount!=null&&!p.estimate),m:100},
  {k:'预估',n:g(p=>p.estimate),m:52},
  {k:'待定',n:g(p=>p.amount==null),sc:NEUTRAL}]);
 const cap=(id,t)=>{const el=document.getElementById(id);if(el)el.textContent=t};
 cap('cAll',`${closed} 个已结项`);
 cap('cActive',`含外部团队 ${extActive} 个`);
 cap('cOverdue',overdue?`最久 ${Math.max(...PROJECTS.map(p=>p.overdue||0))} 天`:'当前无逾期节点');
}
function updateStats(){document.getElementById('kAll').textContent=PROJECTS.length;document.getElementById('kActive').textContent=PROJECTS.filter(x=>x.active).length;document.getElementById('kOverdue').textContent=PROJECTS.filter(x=>x.overdue).length;document.getElementById('kDelivery').textContent=PROJECTS.filter(x=>x.delivery).length;document.getElementById('kQuarter').textContent=PROJECTS.length;renderKpiViz()}
function pickKpi(k){state.kpi=k;render();document.getElementById('projectBoard').scrollIntoView({behavior:'smooth',block:'start'})}

dropdown(document.getElementById('stageDD'),['全部阶段','未开始','Idea 阶段','成片已出'],'stage');
dropdown(document.getElementById('typeDD'),['全部项目类型','含外部团队','内部团队'],'type');
dropdown(document.getElementById('progressDD'),['全部制作进度','进行中','未开始','成片已出'],'progress');
dropdown(document.getElementById('ownerDD'),['全部负责人','我负责的','其他负责人'],'owner');
document.querySelectorAll('.kpi').forEach(k=>k.onclick=()=>pickKpi(k.dataset.kpi));
document.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{state.scope=b.dataset.scope;render()});
document.getElementById('searchInput').oninput=e=>{state.search=e.target.value.trim();render()};
document.getElementById('createBtn').onclick=()=>openProjectModal();
document.getElementById('exportBtn').onclick=()=>{const rows=filtered();const csv=['项目,合同金额,制作进度,资金,执行周期',...rows.map(p=>[p.name,p.amount??'',p.progress,p.fund,`${p.start}${p.end?' → '+p.end:' 起'}`].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(','))].join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='项目管理.csv';a.click();URL.revokeObjectURL(a.href);toast(`已导出 ${rows.length} 个项目。`)};
document.getElementById('bellBtn').onclick=()=>toast('当前有 3 个逾期节点与 1 个待确认交付项目。');
document.getElementById('userMenuBtn').onclick=()=>toast('当前账号：Kora · 项目管理');
document.getElementById('refreshBtn').onclick=e=>{e.currentTarget.classList.add('spin');setTimeout(()=>e.currentTarget.classList.remove('spin'),760);updateStats();render();toast('项目数据已按 2026-08-21 快照刷新。')};
const tableWrap=document.querySelector('.tablewrap');
tableWrap.addEventListener('scroll',()=>tableWrap.classList.toggle('is-scrolled',tableWrap.scrollLeft>2),{passive:true});
scrim.onclick=e=>{if(e.target===scrim)closeDialog()};
document.addEventListener('click',e=>{if(!e.target.closest('.dd'))document.querySelectorAll('.dd.open').forEach(x=>x.classList.remove('open'));if(!e.target.closest('.rowmenu')&&!e.target.closest('[data-more]'))closeRowMenu();if(!e.target.closest('.selectcontrol'))modalContent.querySelectorAll('.selectcontrol.open').forEach(x=>x.classList.remove('open'))});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(scrim.classList.contains('show'))closeDialog();else closeRowMenu()}});
updateStats();render();
</script>
