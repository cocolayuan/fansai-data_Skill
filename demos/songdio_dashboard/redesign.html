.roipill{padding:0;border:0;border-radius:0;background:none;font:inherit;color:inherit}

/* A 1.5k grid keeps the download chart and channel breakdown compact. */
.overview-charts.download-layout .trend-card{height:auto;min-height:350px;border-radius:22px}

/* FansAI header: navigation left, date and actions right, aligned to the page safe edge. */
.topbar{height:auto;min-height:100px;padding:24px 0 22px;gap:20px;align-items:center}
.topbar .dashboard-nav{margin:0;justify-self:start;flex-shrink:0}

.header-controls .topactions{gap:12px;flex:none}

#metrics .metric-revenue .big,

/* Shared date-range picker: keeps data/filter calculations in the existing app. */
(() => {
  const trigger = document.getElementById('date-range-trigger');
  const popover = document.getElementById('date-range-popover');
  if (!trigger || !popover) return;
  trigger.setAttribute('aria-controls', popover.id);
  // Keep the calendar outside the horizontally scrolling filter strip.
  document.body.appendChild(popover);

  const weekdays = ['一', '二', '三', '四', '五', '六', '日'];
  const weekdayLabels = ['日', '一', '二', '三', '四', '五', '六'];
  let draft = { start: '', end: '' };
  let activePart = 'start';
  let replaceEndpoint = false;
  let visibleMonth;
  let keyboardDate = '';
  let previousFocus = null;
  // One calendar UI, with either overview state or a caller-owned local range.
  let selectionContext = null;
  const activeTrigger = () => selectionContext?.anchor || trigger;

  function parseDate(value) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(value || '')) return null;
    const [year, month, day] = value.split('-').map(Number);
    const date = new Date(year, month - 1, day, 12);
    return date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day ? date : null;
  }
  const toISO = date => localDateString(date);
  const displayDate = value => value ? value.replaceAll('-', '/') : '请选择日期';
  const firstOfMonth = date => new Date(date.getFullYear(), date.getMonth(), 1, 12);
  const offsetMonth = (date, offset) => new Date(date.getFullYear(), date.getMonth() + offset, 1, 12);
  const validRange = () => Boolean(parseDate(draft.start) && parseDate(draft.end) && draft.start <= draft.end);
  const monthContains = value => {
    const date = parseDate(value);
    return date && date >= visibleMonth && date < offsetMonth(visibleMonth, 2);
  };
  const arrow = direction => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="${direction === 'prev' ? 'M14 6l-6 6 6 6' : 'M10 6l6 6-6 6'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  function sync() {
    document.getElementById('range-start-text').textContent = displayDate(state.start);
    document.getElementById('range-end-text').textContent = state.start && state.end && state.start.slice(0, 4) === state.end.slice(0, 4) ? displayDate(state.end).slice(5) : displayDate(state.end);
    trigger.setAttribute('aria-label', `日期范围：${displayDate(state.start)} 至 ${displayDate(state.end)}，点击选择日期`);
    trigger.setAttribute('aria-expanded', String(!popover.hidden && !selectionContext));
  }

  function calendar(date, index) {
    const year = date.getFullYear();
    const month = date.getMonth();
    const firstWeekday = (new Date(year, month, 1, 12).getDay() + 6) % 7;
    const today = toISO(new Date());
    const days = [];
    // Always render six complete Monday-first weeks, including adjacent dates.
    for (let cell = 0; cell < 42; cell++) {
      const day = cell - firstWeekday + 1;
      const dayDate = new Date(year, month, day, 12);
      const value = toISO(dayDate);
      const outside = dayDate.getMonth() !== month;
      const isStart = value === draft.start;
      const isEnd = value === draft.end;
      const inRange = validRange() && value > draft.start && value < draft.end;
      const classes = ['rp-day', outside && 'is-outside', isStart && 'is-start', isEnd && 'is-end', inRange && 'in-range', value === today && 'is-today'].filter(Boolean).join(' ');
      const label = `${dayDate.getFullYear()}年${dayDate.getMonth() + 1}月${dayDate.getDate()}日 星期${weekdayLabels[dayDate.getDay()]}${outside ? '，相邻月份' : ''}${isStart ? '，开始日期' : ''}${isEnd ? '，结束日期' : ''}`;
      days.push(`<button type="button" class="${classes}" data-rp-date="${value}" aria-label="${label}" aria-pressed="${Boolean(isStart || isEnd || inRange)}"${value === today ? ' aria-current="date"' : ''} tabindex="${!outside && value === keyboardDate ? '0' : '-1'}">${dayDate.getDate()}</button>`);
    }
    return `<section class="rp-calendar" aria-labelledby="rp-month-${index}"><h3 id="rp-month-${index}">${year}年 ${month + 1}月</h3><div class="rp-weekdays" aria-hidden="true">${weekdays.map(day => `<span>${day}</span>`).join('')}</div><div class="rp-days">${days.join('')}</div></section>`;
  }

  function render(focusSelector) {
    if (!monthContains(keyboardDate)) keyboardDate = monthContains(draft[activePart]) ? draft[activePart] : toISO(visibleMonth);
    let rangeLabel = '请选择开始和结束日期';
    if (validRange()) {
      const start = parseDate(draft.start);
      const end = parseDate(draft.end);
      const count = Math.round((Date.UTC(end.getFullYear(), end.getMonth(), end.getDate()) - Date.UTC(start.getFullYear(), start.getMonth(), start.getDate())) / 86400000) + 1;
      rangeLabel = `共 ${count} 天`;
    } else if (draft.start && !draft.end) rangeLabel = '请选择结束日期';
    const invalid = draft.start && draft.end && draft.start > draft.end;
    popover.innerHTML = `<div class="rp-header"><div class="rp-fields"><button type="button" class="rp-field${activePart === 'start' ? ' is-active' : ''}" data-rp-part="start" aria-pressed="${activePart === 'start'}"><span>开始日期</span><strong>${displayDate(draft.start)}</strong></button><span class="rp-range-separator" aria-hidden="true">→</span><button type="button" class="rp-field${activePart === 'end' ? ' is-active' : ''}" data-rp-part="end" aria-pressed="${activePart === 'end'}"><span>结束日期</span><strong>${displayDate(draft.end)}</strong></button></div><button type="button" class="iconbtn rp-close" data-rp-action="cancel" aria-label="关闭日期选择"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div><div class="rp-month-nav"><button type="button" class="iconbtn" data-rp-action="prev" aria-label="显示上一个月">${arrow('prev')}</button><span aria-live="polite">${activePart === 'start' ? '选择开始日期' : '选择结束日期'}</span><button type="button" class="iconbtn" data-rp-action="next" aria-label="显示下一个月">${arrow('next')}</button></div><div class="rp-calendars">${calendar(visibleMonth, 0)}${calendar(offsetMonth(visibleMonth, 1), 1)}</div><p class="rp-error" role="status"${invalid ? '' : ' hidden'}>开始日期不能晚于结束日期</p><div class="rp-footer"><div class="rp-footer-meta"><div class="rp-quick-actions"><button type="button" class="btn rp-quick" data-rp-action="clear">清除</button><button type="button" class="btn rp-quick" data-rp-action="today">今天</button></div><span class="rp-range-count" aria-live="polite">${rangeLabel}</span></div><div class="rp-footer-actions"><button type="button" class="btn" data-rp-action="cancel">取消</button><button type="button" class="btn dark" data-rp-action="apply"${validRange() ? '' : ' disabled'}>应用</button></div></div>`;
    window.FansAIOverlay?.position();
    if (focusSelector) {
      const focusTarget = focusSelector.startsWith('[data-rp-date=')
        ? popover.querySelector(focusSelector + ':not(.is-outside)') || popover.querySelector(focusSelector)
        : popover.querySelector(focusSelector);
      focusTarget?.focus({ preventScroll: true });
    }
  }

  function open(part = 'start', context = null) {
    window.FansAIOverlay?.close(false);
    close(false);
    selectionContext = context;
    const anchor = activeTrigger();
    previousFocus = context ? anchor : document.activeElement;
    draft = { start: context?.start ?? state.start, end: context?.end ?? state.end };
    if (context) {
      context.controls = anchor.getAttribute('aria-controls');
      context.haspopup = anchor.getAttribute('aria-haspopup');
      anchor.setAttribute('aria-controls', popover.id);
      anchor.setAttribute('aria-haspopup', 'dialog');
    }
    popover.setAttribute('aria-label', context ? '选择广告日期范围' : '选择日期范围');
    popover.dataset.align = context ? 'end' : 'start';
    activePart = part === 'end' ? 'end' : 'start';
    replaceEndpoint = activePart === 'end';
    const chosen = parseDate(draft[activePart]) || parseDate(draft.start) || parseDate(DATA.meta.start) || new Date();
    visibleMonth = firstOfMonth(chosen);
    // Adjacent months show both existing endpoints whenever possible.
    const initialStart = parseDate(draft.start);
    if (initialStart && chosen >= firstOfMonth(initialStart) && chosen < offsetMonth(firstOfMonth(initialStart), 2)) visibleMonth = firstOfMonth(initialStart);
    keyboardDate = toISO(chosen);
    popover.hidden = false;
    window.FansAIOverlay?.open('date', popover, anchor, () => close(false));
    anchor.setAttribute('aria-expanded', 'true');
    render(`[data-rp-part="${activePart}"]`);
  }

  function close(restoreFocus = true) {
    window.FansAIOverlay?.release('date');
    const wasOpen = !popover.hidden;
    const anchor = activeTrigger();
    popover.hidden = true;
    anchor.setAttribute('aria-expanded', 'false');
    if (selectionContext) {
      for (const [attribute,value] of [['aria-controls',selectionContext.controls],['aria-haspopup',selectionContext.haspopup]]) {
        if (value == null) anchor.removeAttribute(attribute); else anchor.setAttribute(attribute,value);
      }
    }
    selectionContext = null;
    if (restoreFocus && wasOpen) {
      const target = previousFocus && previousFocus.isConnected && typeof previousFocus.focus === 'function' ? previousFocus : anchor;
      target.focus({ preventScroll: true });
    }
  }

  function chooseDate(value) {
    if (activePart === 'start') {
      draft.start = value;
      if (!replaceEndpoint || (draft.end && value > draft.end)) draft.end = '';
      activePart = draft.end ? 'start' : 'end';
    } else if (!draft.start || value < draft.start) {
      // An earlier day starts a new range; the next click chooses its end.
      draft.start = value;
      draft.end = '';
      activePart = 'end';
    } else {
      draft.end = value;
      activePart = 'start';
    }
    replaceEndpoint = false;
    keyboardDate = value;
    if (!monthContains(value)) visibleMonth = firstOfMonth(parseDate(value));
    render(`[data-rp-date="${value}"]`);
  }

  trigger.addEventListener('click', event => {
    if (!popover.hidden) { close(); return; }
    open(event.target.closest('[data-range-part]')?.dataset.rangePart || 'start');
  });

  popover.addEventListener('click', event => {
    const target = event.target.closest('button');
    if (!target || !popover.contains(target)) return;
    const part = target.dataset.rpPart;
    const action = target.dataset.rpAction;
    if (part) {
      activePart = part;
      replaceEndpoint = true;
      if (parseDate(draft[part]) && !monthContains(draft[part])) visibleMonth = firstOfMonth(parseDate(draft[part]));
      keyboardDate = draft[part] || draft.start || toISO(visibleMonth);
      render(`[data-rp-part="${part}"]`);
    } else if (target.dataset.rpDate) chooseDate(target.dataset.rpDate);
    else if (action === 'prev' || action === 'next') {
      visibleMonth = offsetMonth(visibleMonth, action === 'prev' ? -1 : 1);
      render(`[data-rp-action="${action}"]`);
    } else if (action === 'clear') {
      draft = { start: '', end: '' };
      activePart = 'start';
      replaceEndpoint = false;
      render('[data-rp-action="clear"]');
    } else if (action === 'today') {
      const today = toISO(new Date());
      draft = { start: today, end: today };
      activePart = 'start';
      replaceEndpoint = false;
      visibleMonth = firstOfMonth(parseDate(today));
      keyboardDate = today;
      render('[data-rp-action="today"]');
    } else if (action === 'cancel') close();
    else if (action === 'apply' && validRange()) {
      if (selectionContext) {
        const {onApply} = selectionContext;
        const range = {...draft};
        close(false);
        onApply(range);
        return;
      }
      state.start = draft.start;
      state.end = draft.end;
      state.quickRange = 'custom';
      syncControls();
      close();
      update();
      sync();
    }
  });

  popover.addEventListener('keydown', event => {
    const target = event.target.closest('[data-rp-date]');
    if (!target) return;
    const key = event.key;
    if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End', 'PageUp', 'PageDown'].includes(key)) return;
    event.preventDefault();
    const current = parseDate(target.dataset.rpDate);
    let next = new Date(current);
    const dayOfWeek = (current.getDay() + 6) % 7;
    if (key === 'PageUp' || key === 'PageDown') {
      const month = current.getMonth() + (key === 'PageUp' ? -1 : 1);
      const lastDay = new Date(current.getFullYear(), month + 1, 0, 12).getDate();
      next = new Date(current.getFullYear(), month, Math.min(current.getDate(), lastDay), 12);
    } else {
      const offset = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7, Home: -dayOfWeek, End: 6 - dayOfWeek }[key];
      next.setDate(current.getDate() + offset);
    }
    keyboardDate = toISO(next);
    if (!monthContains(keyboardDate)) visibleMonth = firstOfMonth(next);
    render(`[data-rp-date="${keyboardDate}"]`);
  });

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && !popover.hidden) {
      event.preventDefault();
      event.stopPropagation();
      close();
    }
  });
  document.addEventListener('pointerdown', event => {
    if (!popover.hidden && !popover.contains(event.target) && !activeTrigger().contains(event.target)) close(false);
  });
  document.addEventListener('focusin', event => {
    if (!popover.hidden && !popover.contains(event.target) && !activeTrigger().contains(event.target)) close(false);
  });
  window.addEventListener('fansai-filters-updated', () => {
    sync();
    if (!popover.hidden) close(false);
  });
  window.dateRangePicker = { open, openFor: context => open('start',context), close, sync };
  sync();
})();

/* FansAI V2.1 — shared viewport-aware popovers and custom tile selectors. */
(() => {
  let active = null;
  const gutter = 12, gap = 8;
  function position() {
    if (!active || active.panel.hidden) return;
    const {panel,anchor} = active;
    const vw=document.documentElement.clientWidth,vh=document.documentElement.clientHeight;
    const r = anchor.getBoundingClientRect();
    if (r.bottom < 0 || r.top > vh || r.right < 0 || r.left > vw) { close(false); return; }
    const width = Math.min(Number(panel.dataset.width)||320, vw-gutter*2);
    panel.style.width = width+'px';
    panel.style.maxHeight = Math.max(120,vh-gutter*2)+'px';
    const natural = panel.scrollHeight+2;
    const below = vh-r.bottom-gap-gutter, above = r.top-gap-gutter;
    const up = below < Math.min(natural,300) && above > below;
    let available = Math.max(100, up ? above : below);
    if(panel.id==='date-range-popover'&&available<360)available=vh-gutter*2;
    panel.style.maxHeight = Math.min(available,Number(panel.dataset.maxHeight)||560)+'px';
    const h=panel.getBoundingClientRect().height;
    const preferred=panel.dataset.align==='end'?r.right-width:r.left;
    panel.style.left=Math.max(gutter,Math.min(vw-width-gutter,preferred))+'px';
    panel.style.top=Math.max(gutter,Math.min(vh-h-gutter,up?r.top-gap-h:r.bottom+gap))+'px';
    panel.dataset.placement=up?'up':'down';
  }
  function close(restoreFocus=true) {
    if(!active)return;
    const previous=active;active=null;previous.panel.hidden=true;previous.anchor.setAttribute('aria-expanded','false');
    previous.onClose?.();
    if(restoreFocus)previous.anchor.focus({preventScroll:true});
  }
  function open(name,panel,anchor,onClose) {

    document.body.appendChild(panel);

    document.querySelector('#tooltip').hidden=true;position();

  const icons={
    calendar:svg('<rect x="3.5" y="5.5" width="17" height="15" rx="2.5"/><path d="M7.5 3.5v4M16.5 3.5v4M3.5 9.5h17M8 14h2m4 0h2m-8 3h2"/>'),

  };
  const specs={

      {label:'数据范围',items:[['snapshot','数据区间','calendar']]},

      panel.innerHTML=spec.groups.map(group=>`<div class="ov-option-group" role="group" aria-label="${group.label}"><div class="ov-group-title">${group.label}</div>${group.items.map(([value,label,ic,code])=>{
        const selected=value===getValue();
        return `<button type="button" role="option" class="ov-option${selected?' is-selected':''}" aria-selected="${selected}" data-option="${value}" tabindex="${selected?'0':'-1'}"><span class="ov-option-icon">${icons[ic]}</span><span class="ov-option-text">${esc(label)}</span><span class="ov-option-meta">${esc(getMeta(value)||code||'')}</span><span class="ov-option-check">${icons.check}</span></button>`;
      }).join('')}</div>`).join('');
    }
    function show(anchor){paint();open(id,panel,anchor);const selected=panel.querySelector('[aria-selected="true"]')||panel.querySelector('[role="option"]');selected?.focus({preventScroll:true});selected?.scrollIntoView({block:'nearest'});}
    panel.addEventListener('click',event=>{
      const option=event.target.closest('[data-option]');if(!option||!panel.contains(option))return;
      const value=option.dataset.option;close();onSelect(value);
    });
    panel.addEventListener('keydown',event=>{
      const buttons=[...panel.querySelectorAll('[role="option"]')];const index=buttons.indexOf(document.activeElement);
      if(['ArrowDown','ArrowUp','Home','End'].includes(event.key)){
        event.preventDefault();const next=event.key==='Home'?0:event.key==='End'?buttons.length-1:(index+(event.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length;
        buttons.forEach((button,i)=>button.tabIndex=i===next?0:-1);buttons[next].focus({preventScroll:true});buttons[next].scrollIntoView({block:'nearest'});
      }
    });
    return {show,toggle(anchor){if(active?.name===id)close();else show(anchor);},close(){if(active?.name===id)close(false);},sync(){if(active?.name===id){paint();position();}}};
  }
  window.FansAIQuickDates={create({id,label,getValue,onSelect,reference}){
    const groups=specs['quick-range'].groups.map(group=>({...group,items:[...group.items]}));
    if(reference)groups[0].items.push(['reference','单日数据','calendar']);
    return createMenu(id,{...specs['quick-range'],label,groups},getValue,onSelect,value=>dateDetail(value,reference),'end');
  }};
  for(const [id,spec] of Object.entries(specs)){
    const input=document.getElementById(id),trigger=document.getElementById(id+'-trigger');
    const options=spec.groups.flatMap(group=>group.items);
    const menu=createMenu(id,spec,()=>input.value,value=>{input.value=value;sync();input.dispatchEvent(new Event('change',{bubbles:true}));},id==='quick-range'?value=>dateDetail(value):undefined);
    function sync(){
      const selected=options.find(option=>option[0]===input.value);
      trigger.querySelector('.ov-value').textContent=id==='quick-range'&&input.value==='custom'?'自定义':selected?.[1]||'请选择';
      trigger.setAttribute('aria-label',spec.label+'：'+(selected?.[1]||'请选择'));
      menu.sync();
    }
    trigger.addEventListener('click',()=>menu.toggle(trigger));
    trigger.addEventListener('keydown',event=>{if(['ArrowDown','ArrowUp'].includes(event.key)){event.preventDefault();menu.show(trigger);}});
    window.addEventListener('fansai-filters-updated',sync);sync();
  }

  // Existing save/restore actions share the same modal family as help dialogs.
  const saved=document.getElementById('save-pop');
  document.getElementById('saved-toggle').onclick=()=>{
    close(false);window.dateRangePicker?.close(false);
    document.getElementById('saved-range').textContent=state.start.replaceAll('-','/')+' — '+state.end.replaceAll('-','/');
    document.getElementById('saved-scope').textContent=[document.querySelector('#platform-trigger .ov-value').textContent,state.income==='new'?'新用户':'全部用户',taxLabel(),document.querySelector('#country-trigger .ov-value').textContent,document.querySelector('.channel-tabs [aria-selected="true"]').textContent.replace('⠿','')].join(' · ');
    const description=document.getElementById('saved-description');
    try{const stored=JSON.parse(localStorage.getItem('fansai-redesign-filter-v3')||localStorage.getItem('fansai-redesign-filter-v1')||'null');description.textContent=stored?'已保存 '+stored.start.replaceAll('-','/')+' — '+stored.end.replaceAll('-','/')+' 的筛选，可应用或更新。':'尚未保存筛选。将当前日期、平台、用户范围、税口径、国家与渠道保存在此浏览器。';document.getElementById('restore-saved').disabled=!stored;}catch{description.textContent='暂时无法读取已保存筛选，可重新保存当前选择。';document.getElementById('restore-saved').disabled=true;}
    saved.showModal();document.getElementById('saved-toggle').setAttribute('aria-expanded','true');
  };
  document.querySelectorAll('[data-dialog-close]').forEach(button=>button.addEventListener('click',()=>button.closest('dialog').close()));
  document.querySelectorAll('dialog.ov-modal').forEach(dialog=>{
    dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();}});
    dialog.addEventListener('close',()=>{document.getElementById('saved-toggle').setAttribute('aria-expanded','false');document.body.classList.remove('dialog-open');});
    const observer=new MutationObserver(()=>document.body.classList.toggle('dialog-open',Boolean(document.querySelector('dialog[open]'))));observer.observe(dialog,{attributes:true,attributeFilter:['open']});
  });
  const hint=document.getElementById('ui-hint');let hintAnchor=null;
  function hideHint(){hint.hidden=true;if(hintAnchor)hintAnchor.removeAttribute('aria-describedby');hintAnchor=null;}
  function showHint(anchor){if(!anchor||active||document.querySelector('dialog[open]'))return;hintAnchor=anchor;hint.textContent=anchor.dataset.tooltip;hint.hidden=false;anchor.setAttribute('aria-describedby','ui-hint');const r=anchor.getBoundingClientRect(),h=hint.getBoundingClientRect();hint.style.left=Math.max(12,Math.min(document.documentElement.clientWidth-h.width-12,r.left+r.width/2-h.width/2))+'px';hint.style.top=Math.max(12,Math.min(document.documentElement.clientHeight-h.height-12,r.top>h.height+12?r.top-h.height-8:r.bottom+8))+'px';}
  document.addEventListener('pointerover',event=>{const anchor=event.target.closest('[data-tooltip]');if(anchor&&anchor!==hintAnchor)showHint(anchor);});
  document.addEventListener('pointerout',event=>{if(hintAnchor&&!hintAnchor.contains(event.relatedTarget))hideHint();});
  document.addEventListener('focusin',event=>showHint(event.target.closest('[data-tooltip]')));
  document.addEventListener('focusout',hideHint);document.addEventListener('pointerdown',hideHint);window.addEventListener('scroll',hideHint,true);
})();

</script>
</body></html>
